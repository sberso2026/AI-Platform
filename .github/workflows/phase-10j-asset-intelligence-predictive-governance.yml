name: Phase 10J Asset Intelligence Predictive Governance

on:
  workflow_dispatch:
  push:
    branches: [master, main, release/**, cursor/**]
    paths:
      - "packages/asset-intelligence/**"
      - "packages/asset-intelligence-certification/**"
      - "packages/platform-certification/src/phase10j*"
      - "supabase/migrations/*asset_intelligence*"
      - "apps/web/src/app/api/engineering/asset-intelligence/**"
      - ".github/workflows/phase-10j-asset-intelligence-predictive-governance.yml"
      - "docs/architecture/ASSET_INTELLIGENCE_PREDICTIVE_GOVERNANCE*"

concurrency:
  group: phase-10j-asset-intelligence-predictive-governance-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"
  ASSET_INTELLIGENCE_CERTIFICATION: "1"
  ASSET_INTELLIGENCE_CERTIFICATION_PROJECT_REF: wcydlhqiqdwgoaqrlget

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --tags --force
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm --filter @rtb/asset-intelligence test
      - name: Architecture tests
        run: pnpm --filter @rtb/platform-certification exec vitest run src/phase10j-asset-intelligence-predictive-governance.test.ts
      - name: Phase 10J certification (gates A–BG)
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          CERT_USER_PASSWORD: ${{ secrets.CERT_USER_PASSWORD }}
        run: pnpm --filter @rtb/asset-intelligence-certification certify:phase10j
      - name: Assert PASS artifact
        run: |
          node <<'EOF'
          const a = JSON.parse(require("fs").readFileSync("packages/asset-intelligence-certification/artifacts/phase10j-asset-intelligence-predictive-governance-certification.json","utf8"));
          const checks = [
            a.verdict==="PASS",
            a.failedGateCount===0,
            a.skippedGateCount===0,
            a.notExecutedGateCount===0,
            a.requiredGates.length===59,
            a.version==="0.10.0-predictive-governance",
            a.predictiveMethodRegistryReady===true,
            a.predictiveMethodEligibilityEngineReady===true,
            a.predictiveMethodQualificationFrameworkReady===true,
            a.predictiveObjectiveRegistryReady===true,
            a.productionPredictiveExecutionEnabled===false,
            a.predictiveMlEnabled===false,
            a.predictiveMethodsCertified===false,
            a.probabilityOfFailureCertified===false,
            a.rulClaimsCertified===false,
            a.accuracyClaimsCertified===false,
            a.predictiveHealthContributionEnabled===false,
            a.productionMemoryRepositoryAllowed===false,
            a.releaseEligible===true,
            a.phase10KReady===true,
            a.unexpected5xx===0,
            a.secretExposureDetected===false,
          ];
          if (checks.some(x=>!x)) { console.error(a); process.exit(1); }
          console.log(JSON.stringify({verdict:a.verdict, version:a.version, phase10KReady:a.phase10KReady},null,2));
          EOF
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase10j-asset-intelligence-predictive-governance-certification
          path: packages/asset-intelligence-certification/artifacts/phase10j-asset-intelligence-predictive-governance-certification.json
          if-no-files-found: warn
