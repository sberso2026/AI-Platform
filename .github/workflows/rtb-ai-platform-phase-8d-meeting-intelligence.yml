name: RTB AI Platform Phase 8D Meeting Intelligence

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - release/**
    paths:
      - "packages/project-intelligence/**"
      - "packages/project-intelligence-certification/**"
      - "packages/platform-certification/**"
      - "packages/engineering-os/**"
      - "packages/platform-commerce/src/domain/commerce-access-policy.ts"
      - "apps/web/src/app/**/project-intelligence/meetings/**"
      - "apps/web/src/app/api/engineering/project-intelligence/meetings/**"
      - "apps/web/src/components/engineering/project-intelligence-shell.tsx"
      - "docs/migration/PROJECT_INTELLIGENCE_MEETING_PHASE_8D*"
      - "docs/architecture/PROJECT_INTELLIGENCE_MEETING*"
      - "docs/security/PROJECT_INTELLIGENCE_MEETING_PRIVACY_RUNTIME.md"
      - "docs/integrations/MICROSOFT_TEAMS_CONNECTOR_STATUS.md"
      - "docs/integrations/MEETING_PROVIDER_STRATEGY.md"
      - "docs/testing/PROJECT_INTELLIGENCE_MEETING_PRODUCTION_BASELINE.md"
      - "supabase/migrations/*project_intelligence_meeting*"
      - ".github/workflows/rtb-ai-platform-phase-8d-meeting-intelligence.yml"

concurrency:
  group: rtb-ai-platform-phase-8d-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORM_CERTIFICATION: "1"
  PROJECT_INTELLIGENCE_CERTIFICATION: "1"
  PROJECT_INTELLIGENCE_CERTIFICATION_TARGET: hosted_staging
  PROJECT_INTELLIGENCE_CERTIFICATION_PROJECT_REF: wcydlhqiqdwgoaqrlget
  ALLOW_PRODUCTION_CERTIFICATION: "false"
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"
  GITHUB_RUN_ID: ${{ github.run_id }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: CI preflight
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm --filter @rtb/project-intelligence-certification ci-preflight

  validate:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rtb/project-intelligence typecheck
      - run: pnpm --filter @rtb/platform-certification test:unit
      - run: pnpm --filter @rtb/project-intelligence test
      - run: pnpm --filter @rtb/engineering-os test

  hosted-schema:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Hosted meeting schema
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          pnpm --filter @rtb/project-intelligence-certification verify-hosted-meeting-schema
          pnpm --filter @rtb/project-intelligence-certification verify-hosted-meeting-processing-schema

  rls-certification:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Provision PI fixtures
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm --filter @rtb/project-intelligence-certification provision
      - name: Meeting RLS matrices
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          pnpm --filter @rtb/project-intelligence-certification exec vitest run src/rls/meeting-rls-matrix.test.ts
          pnpm --filter @rtb/project-intelligence-certification exec vitest run src/rls/meeting-processing-rls-matrix.test.ts
      - name: Cleanup PI fixtures
        if: always()
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm --filter @rtb/project-intelligence-certification cleanup

  provider-certification:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rtb/project-intelligence exec vitest run tests/meeting-providers-access.test.ts tests/teams-provider-unit.test.ts tests/teams-live-graph-mode.test.ts
      - run: pnpm --filter @rtb/project-intelligence-certification test:teams-provider
      - run: pnpm --filter @rtb/project-intelligence exec vitest run tests/phase8d-meeting-integration.test.ts

  lifecycle-certification:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rtb/project-intelligence-certification exec vitest run src/meetings/lifecycle.test.ts
      - run: pnpm --filter @rtb/project-intelligence exec vitest run tests/meeting-state-machine.test.ts

  privacy-certification:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rtb/project-intelligence-certification exec vitest run src/meetings/consent.test.ts

  realtime-certification:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rtb/project-intelligence exec vitest run tests/transcript-ordering.test.ts
      - run: pnpm --filter @rtb/project-intelligence-certification exec vitest run src/meetings/service-surfaces.test.ts

  processing-certification:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rtb/project-intelligence exec vitest run tests/meeting-processing-enqueue.test.ts tests/meeting-processing-domain.test.ts
      - run: pnpm --filter @rtb/project-intelligence-certification test:meeting-processing

  grounding-certification:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rtb/project-intelligence-certification exec vitest run src/meetings/processing-domain.test.ts
      - run: pnpm --filter @rtb/platform-certification exec vitest run src/phase8d-meeting-intelligence-integration.test.ts

  minutes-certification:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rtb/project-intelligence-certification exec vitest run src/meetings/processing-domain.test.ts

  proposal-certification:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rtb/project-intelligence exec vitest run tests/meeting-processing-domain.test.ts
      - run: pnpm --filter @rtb/project-intelligence exec vitest run tests/phase8d-meeting-integration.test.ts

  review-certification:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rtb/project-intelligence-certification exec vitest run src/meetings/processing-domain.test.ts

  core-conversion:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rtb/project-intelligence-certification exec vitest run src/meetings/processing-domain.test.ts

  findings-handoff:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rtb/project-intelligence exec vitest run tests/phase8d-meeting-integration.test.ts
      - run: pnpm --filter @rtb/platform-certification exec vitest run src/phase8d-meeting-intelligence-integration.test.ts

  browser-certification:
    needs:
      - hosted-schema
      - rls-certification
      - provider-certification
      - lifecycle-certification
      - privacy-certification
      - realtime-certification
      - processing-certification
      - grounding-certification
      - minutes-certification
      - proposal-certification
      - review-certification
      - core-conversion
      - findings-handoff
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CERT_USER_PASSWORD: ${{ secrets.CERT_USER_PASSWORD }}
      COMMERCE_AUTH_SECRET: ${{ secrets.COMMERCE_AUTH_SECRET }}
      COMMERCE_SCHEDULER_SECRET: ${{ secrets.COMMERCE_SCHEDULER_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rtb/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Provision full PI entitlement fixture
        run: pnpm --filter @rtb/project-intelligence-certification provision
      - name: Verify fixture readiness
        run: pnpm --filter @rtb/project-intelligence-certification verify-fixture
      - run: pnpm --filter @rtb/project-intelligence-certification exec playwright install chromium
      - name: Browser E2E meetings foundation + processing (CERTIFY_BROWSER=1)
        env:
          PROJECT_INTELLIGENCE_CERTIFICATION: "1"
          PI_MEETING_FOUNDATION_CERTIFICATION: "1"
          PI_MEETING_PROCESSING_CERTIFICATION: "1"
          PROJECT_INTELLIGENCE_RUNTIME_MODE: hosted_staging
          PROJECT_INTELLIGENCE_CERTIFICATION_TARGET: hosted_staging
          PROJECT_INTELLIGENCE_CERTIFICATION_PROJECT_REF: wcydlhqiqdwgoaqrlget
          CERTIFY_BROWSER: "1"
        run: |
          pnpm --filter @rtb/web start &
          npx --yes wait-on http://127.0.0.1:3000
          pnpm --filter @rtb/project-intelligence-certification test:e2e:meetings
          pnpm --filter @rtb/project-intelligence-certification test:e2e:meetings-processing
      - name: Phase 8D certify (gates A–AC, CERTIFY_BROWSER=1)
        env:
          CERTIFY_BROWSER: "1"
          BROWSER_E2E_ALREADY_PASSED: "1"
          GITHUB_SHA: ${{ github.sha }}
        run: pnpm --filter @rtb/project-intelligence-certification certify:phase8d
      - name: Cleanup PI fixtures
        if: always()
        continue-on-error: true
        run: pnpm --filter @rtb/project-intelligence-certification cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase8d-meeting-intelligence-certification
          path: packages/project-intelligence-certification/artifacts/phase8d-meeting-intelligence-certification.json
          if-no-files-found: error

  accessibility:
    needs: browser-certification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: phase8d-meeting-intelligence-certification
          path: artifacts
      - name: Verify accessibility gate Y
        run: |
          node -e "const a=require('./artifacts/phase8d-meeting-intelligence-certification.json'); const g=a.gates.find(x=>x.id==='Y'); if(!g||g.status!=='pass') { console.error(g); process.exit(1);} "

  responsive:
    needs: browser-certification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: phase8d-meeting-intelligence-certification
          path: artifacts
      - name: Verify responsive gate Z
        run: |
          node -e "const a=require('./artifacts/phase8d-meeting-intelligence-certification.json'); const g=a.gates.find(x=>x.id==='Z'); if(!g||g.status!=='pass') { console.error(g); process.exit(1);} "

  performance:
    needs: browser-certification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: phase8d-meeting-intelligence-certification
          path: artifacts
      - name: Verify performance gate AA
        run: |
          node -e "const a=require('./artifacts/phase8d-meeting-intelligence-certification.json'); const g=a.gates.find(x=>x.id==='AA'); if(!g||g.status!=='pass') { console.error(g); process.exit(1);} "

  secret-scan:
    needs: browser-certification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: phase8d-meeting-intelligence-certification
          path: artifacts
      - name: Verify secret gate AB
        run: |
          node -e "const a=require('./artifacts/phase8d-meeting-intelligence-certification.json'); if(a.secretExposure) process.exit(1); const g=a.gates.find(x=>x.id==='AB'); if(!g||g.status!=='pass') process.exit(1);"

  release-evidence:
    needs:
      - accessibility
      - responsive
      - performance
      - secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: phase8d-meeting-intelligence-certification
          path: artifacts
      - name: Verify releaseEligible and productionMeetingIntelligenceReady
        run: |
          node -e "
          const a=require('./artifacts/phase8d-meeting-intelligence-certification.json');
          const sha=process.env.GITHUB_SHA;
          console.log(JSON.stringify({verdict:a.verdict, releaseEligible:a.releaseEligible, productionMeetingIntelligenceReady:a.productionMeetingIntelligenceReady, productionTeamsProviderReady:a.productionTeamsProviderReady, certifyBrowser:a.certifyBrowser, ciHeadSha:a.ciHeadSha, artifactCommitSha:a.artifactCommitSha, buildIdentitySha:a.buildIdentitySha, failedGates:a.failedGates, notExecutedGates:a.notExecutedGates, providerStatuses:a.providerStatuses},null,2));
          if(a.verdict!=='PASS') process.exit(1);
          if(!a.releaseEligible) process.exit(1);
          if(!a.productionMeetingIntelligenceReady) process.exit(1);
          if(a.productionTeamsProviderReady!==false) process.exit(1);
          if(a.certifyBrowser!==true) process.exit(1);
          if(a.failedGateCount!==0 || a.notExecutedGateCount!==0 || a.skippedGateCount!==0) process.exit(1);
          if(a.ciHeadSha!==sha || a.artifactCommitSha!==a.buildIdentitySha) process.exit(1);
          if(a.providerStatuses.microsoft_teams_live!=='conditionally_deferred') process.exit(1);
          "
