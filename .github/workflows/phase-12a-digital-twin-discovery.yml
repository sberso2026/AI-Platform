name: Phase 12A Digital Twin Discovery

on:
  workflow_dispatch:
  push:
    branches: [master, main, release/**, cursor/**]
    paths:
      - "packages/digital-twin/**"
      - "packages/digital-twin-certification/**"
      - "packages/platform-certification/src/phase12a*"
      - "packages/engineering-os/src/module-registry.ts"
      - "packages/platform-kernel/src/digital-twin/**"
      - "docs/architecture/DIGITAL_TWIN_*"
      - "docs/architecture/DIGITAL_THREAD_*"
      - "docs/contracts/DIGITAL_TWIN_*"
      - ".github/workflows/phase-12a-digital-twin-discovery.yml"

concurrency:
  group: phase-12a-digital-twin-discovery-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORM_CERTIFICATION: "1"
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch release tags
        run: git fetch --tags --force
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm --filter @rtb/digital-twin test
      - name: Architecture tests
        run: pnpm --filter @rtb/platform-certification exec vitest run src/phase12a-digital-twin-discovery.test.ts
      - name: Secret scan
        run: pnpm --filter @rtb/digital-twin-certification secret-scan
      - name: Phase 12A certification (gates A–AM)
        run: pnpm --filter @rtb/digital-twin-certification certify:phase12a
      - name: Assert PASS artifact
        run: |
          node <<'EOF'
          const a = JSON.parse(require("fs").readFileSync("packages/digital-twin-certification/artifacts/phase12a-digital-twin-discovery-certification.json","utf8"));
          const checks = [
            ["verdict", a.verdict==="PASS"],
            ["failedGateCount", a.failedGateCount===0],
            ["skippedGateCount", a.skippedGateCount===0],
            ["notExecutedGateCount", a.notExecutedGateCount===0],
            ["gateCount", Array.isArray(a.requiredGates) && a.requiredGates.length===39],
            ["version", a.version==="0.1.0-discovery"],
            ["status", a.status==="discovery"],
            ["productionDigitalTwinReady", a.productionDigitalTwinReady===false],
            ["digitalTwinImplemented", a.digitalTwinImplemented===false],
            ["discoveryImplemented", a.discoveryImplemented===true],
            ["digitalTwinRuntimeImplemented", a.digitalTwinRuntimeImplemented===false],
            ["liveTelemetryImplemented", a.liveTelemetryImplemented===false],
            ["simulationExecutionImplemented", a.simulationExecutionImplemented===false],
            ["threeDViewerImplemented", a.threeDViewerImplemented===false],
            ["physicalActuationEnabled", a.physicalActuationEnabled===false],
            ["automaticControlEnabled", a.automaticControlEnabled===false],
            ["implementsOwnAiStack", a.implementsOwnAiStack===false],
            ["projectControlsV1Intact", a.projectControlsV1Intact===true],
            ["projectControlsV1TagNotMoved", a.projectControlsV1TagMoved===false],
            ["projectControlsV1TagTarget", a.projectControlsV1TagTarget==="b17fe4cfe2574520ec813a7b43ba7328a585d741"],
            ["assetIntelligenceV1Intact", a.assetIntelligenceV1Intact===true],
            ["projectIntelligenceV1Intact", a.projectIntelligenceV1Intact===true],
            ["inspectionIntelligenceV1Intact", a.inspectionIntelligenceV1Intact===true],
            ["productTablesIntroduced", a.digitalTwinProductTablesIntroduced===false],
            ["productMigrations", Array.isArray(a.digitalTwinProductMigrations) && a.digitalTwinProductMigrations.length===0],
            ["productUiImplemented", a.digitalTwinProductUiImplemented===false],
            ["moduleRegistryStatus", a.moduleRegistryStatus==="coming_soon"],
            ["duplicateAssetOwnershipDetected", a.duplicateAssetOwnershipDetected===false],
            ["duplicateProjectOwnershipDetected", a.duplicateProjectOwnershipDetected===false],
            ["publicContractVersion", a.publicContractVersion==="0.1.0-draft"],
            ["secretExposureDetected", a.secretExposureDetected===false],
            ["phase12BReady", a.phase12BReady===true],
            ["releaseEligible", a.releaseEligible===true],
          ];
          const failed = checks.filter(([, ok]) => !ok).map(([n]) => n);
          if (failed.length) {
            console.error("Assert failed:", failed);
            console.error(JSON.stringify({ failedGates: a.failedGates }, null, 2));
            process.exit(1);
          }
          console.log(JSON.stringify({
            verdict: a.verdict,
            version: a.version,
            phase12BReady: a.phase12BReady,
          }, null, 2));
          EOF
      - name: Upload certification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase12a-digital-twin-discovery-certification
          path: packages/digital-twin-certification/artifacts/phase12a-digital-twin-discovery-certification.json
          if-no-files-found: warn
