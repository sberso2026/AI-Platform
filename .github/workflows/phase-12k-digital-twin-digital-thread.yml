name: Phase 12K Digital Twin Digital Thread

on:
  workflow_dispatch:
  push:
    branches: [master, main, release/**, cursor/**]
    paths:
      - "packages/digital-twin/**"
      - "packages/digital-twin-certification/**"
      - "packages/platform-certification/src/phase12k*"
      - "supabase/migrations/*batch_84*"
      - "apps/web/src/app/api/engineering/digital-twin/**"
      - "apps/web/src/app/(platform)/engineering/apps/digital-twin/**"
      - "docs/architecture/DIGITAL_TWIN_*THREAD*"
      - "docs/architecture/DIGITAL_TWIN_PHASE_12K*"
      - ".github/workflows/phase-12k-digital-twin-digital-thread.yml"

concurrency:
  group: phase-12k-digital-twin-digital-thread-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORM_CERTIFICATION: "1"
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"
  CERTIFY_BROWSER: "1"
  REAL_SOLVER_HOSTED: "1"

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch release tags
        run: git fetch --tags --force
      - name: Install CalculiX (ccx)
        run: sudo apt-get update && sudo apt-get install -y calculix-ccx
      - name: Verify CalculiX binary
        run: |
          which ccx
          ccx -v || true
          command -v ccx
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm --filter @rtb/digital-twin test
      - name: Architecture tests
        run: pnpm --filter @rtb/platform-certification exec vitest run src/phase12k-digital-twin-digital-thread.test.ts
      - name: Secret scan
        run: pnpm --filter @rtb/digital-twin-certification secret-scan
      - name: Install Playwright Chromium
        run: pnpm --filter @rtb/digital-twin-certification exec playwright install --with-deps chromium
      - name: Browser E2E digital thread (CERTIFY_BROWSER=1)
        run: pnpm --filter @rtb/digital-twin-certification test:e2e:digital-thread
      - name: Phase 12K certification (gates A–CD)
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          CERT_USER_PASSWORD: ${{ secrets.CERT_USER_PASSWORD }}
          CERTIFY_BROWSER: "1"
          REAL_SOLVER_HOSTED: "1"
        run: pnpm --filter @rtb/digital-twin-certification certify:phase12k
      - name: Assert PASS artifact
        run: |
          node <<'EOF'
          const a = JSON.parse(require("fs").readFileSync("packages/digital-twin-certification/artifacts/phase12k-digital-twin-digital-thread-certification.json","utf8"));
          const checks = [
            ["verdict", a.verdict==="PASS"],
            ["failedGateCount", a.failedGateCount===0],
            ["skippedGateCount", a.skippedGateCount===0],
            ["notExecutedGateCount", a.notExecutedGateCount===0],
            ["gateCount", Array.isArray(a.requiredGates) && a.requiredGates.length===82],
            ["version", a.version==="0.11.0-digital-thread"],
            ["status", a.status==="digital_thread"],
            ["digitalTwinImplemented", a.digitalTwinImplemented===true],
            ["productionDigitalTwinReady", a.productionDigitalTwinReady===false],
            ["digitalThreadIntelligenceReady", a.digitalThreadIntelligenceReady===true],
            ["provenanceReady", a.provenanceReady===true],
            ["integrityAssessmentReady", a.integrityAssessmentReady===true],
            ["temporalTraversalReady", a.temporalTraversalReady===true],
            ["changeSetReady", a.changeSetReady===true],
            ["knowledgeGraphReuseReady", a.knowledgeGraphReuseReady===true],
            ["duplicateKnowledgeGraphDetected", a.duplicateKnowledgeGraphDetected===false],
            ["solverCapabilityRegistryReady", a.solverCapabilityRegistryReady===true],
            ["fourLayerQualificationIntact", a.fourLayerQualificationIntact===true],
            ["realSolverExecutionCertified", a.realSolverExecutionCertified===true],
            ["calculixAdapterIntact", a.calculixAdapterIntact===true],
            ["realSolverHostedExecutionCertified", a.realSolverHostedExecutionCertified===true],
            ["silentSolverFallbackAllowed", a.silentSolverFallbackAllowed===false],
            ["nativeEngineeringSolverImplemented", a.nativeEngineeringSolverImplemented===false],
            ["predictiveTwinImplemented", a.predictiveTwinImplemented===false],
            ["probabilityOfFailureImplemented", a.probabilityOfFailureImplemented===false],
            ["rulImplemented", a.rulImplemented===false],
            ["physicalActuationImplemented", a.physicalActuationImplemented===false],
            ["automaticControlImplemented", a.automaticControlImplemented===false],
            ["spatialOwnershipFullyResolved", a.spatialOwnershipFullyResolved===false],
            ["phase12JReady", a.phase12JReady===true],
            ["phase12KReady", a.phase12KReady===true],
            ["phase12LReady", a.phase12LReady===true],
            ["releaseEligible", a.releaseEligible===true],
            ["publicContractVersion", a.publicContractVersion==="0.11.0-digital-thread-draft"],
            ["unexpected5xx", a.unexpected5xx===0],
            ["noPascalDuplicate", a.RealSolverExecutionCertified===undefined],
          ];
          const failed = checks.filter(([, ok]) => !ok).map(([n]) => n);
          if (failed.length) {
            console.error("Assert failed:", failed);
            console.error(JSON.stringify({ failedGates: a.failedGates }, null, 2));
            process.exit(1);
          }
          console.log(JSON.stringify({ verdict: a.verdict, version: a.version, gateCount: a.gateCount }, null, 2));
          EOF
      - name: Upload certification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase12k-digital-twin-digital-thread-certification
          path: packages/digital-twin-certification/artifacts/phase12k-digital-twin-digital-thread-certification.json
