name: Cortex AI Platform Production Certification

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - release/**
    paths:
      - "packages/cortex-platform-certification/**"
      - "packages/reference-os/**"
      - "packages/platform-core/**"
      - "packages/types/src/os-runtime.ts"
      - "docs/architecture/CORTEX_AI_*.md"
      - "docs/product/CORTEX_AI_*.md"
      - "docs/integrations/**"
      - ".github/workflows/cortex-platform-production-certification.yml"

concurrency:
  group: cortex-platform-${{ github.ref }}
  cancel-in-progress: true

env:
  CORTEX_PLATFORM_CERTIFICATION: "1"
  CORTEX_PLATFORM_CERTIFICATION_TARGET: hosted_staging
  ALLOW_PRODUCTION_CERTIFICATION: "false"
  PNPM_VERSION: "9.15.0"
  NODE_VERSION: "22"

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: CI preflight
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm --filter @rtb/cortex-platform-certification ci-preflight

  certify:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Cortex platform certification
        env:
          GITHUB_SHA: ${{ github.sha }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm --filter @rtb/cortex-platform-certification certify

      - name: Upload certification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cortex-platform-certification
          path: packages/cortex-platform-certification/artifacts/cortex-platform-certification.json
          if-no-files-found: error

  release-evidence:
    needs: certify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cortex-platform-certification
          path: artifacts

      - name: Verify releaseEligible and SHA match
        run: |
          node -e "
            const fs = require('fs');
            const a = JSON.parse(fs.readFileSync('artifacts/cortex-platform-certification.json','utf8'));
            console.log(JSON.stringify({
              verdict: a.verdict,
              releaseEligible: a.releaseEligible,
              ciHeadSha: a.ciHeadSha,
              artifactCommitSha: a.artifactCommitSha,
              buildIdentitySha: a.buildIdentitySha,
              failedGates: a.failedGates,
              microsoftTeamsLiveConnector: a.microsoftTeamsLiveConnector,
            }, null, 2));
            if (a.verdict !== 'PASS' || !a.releaseEligible) process.exit(1);
            if (a.artifactCommitSha !== a.ciHeadSha || a.ciHeadSha !== a.buildIdentitySha) process.exit(1);
            if (a.requiredTestsSkipped !== 0 || a.unexpected5xx !== 0 || a.secretExposureCount !== 0) process.exit(1);
          "
