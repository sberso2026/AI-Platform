name: Phase 14A Engineering OS GA Readiness

on:
  workflow_dispatch:
  push:
    branches: [master, main, release/**, cursor/**]
    paths:
      - "packages/engineering-os/**"
      - "packages/engineering-os-certification/**"
      - "packages/platform-certification/src/phase14a*"
      - "docs/architecture/ENGINEERING_OS_*"
      - "docs/architecture/CLIENT_OWNED_COMMERCIAL_SOLVER_EXECUTION_ARCHITECTURE.md"
      - "docs/architecture/adr/ADR_CLIENT_OWNED_COMMERCIAL_SOLVER_EXECUTION.md"
      - "docs/commercial/ENGINEERING_OS_V1_PACKAGING_ARCHITECTURE.md"
      - "docs/security/ENGINEERING_OS_V1_SECURITY_BOUNDARY.md"
      - "docs/operations/ENGINEERING_OS_V1_*"
      - ".github/workflows/phase-14a-engineering-os-ga-readiness.yml"

concurrency:
  group: phase-14a-engineering-os-ga-readiness-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORM_CERTIFICATION: "1"
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch release tags
        run: git fetch --tags --force
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests (Engineering OS)
        run: pnpm --filter @rtb/engineering-os test
      - name: Architecture tests
        run: pnpm --filter @rtb/platform-certification exec -- vitest run src/phase14a-engineering-os-ga-readiness.test.ts
      - name: Secret scan
        run: pnpm --filter @rtb/engineering-os-certification secret-scan
      - name: Phase 14A certification (gates A–BL)
        run: pnpm --filter @rtb/engineering-os-certification certify:phase14a
      - name: Assert PASS artifact
        run: |
          node <<'EOF'
          const a = JSON.parse(require("fs").readFileSync("packages/engineering-os-certification/artifacts/phase14a-engineering-os-ga-readiness-certification.json","utf8"));
          const checks = [
            ["verdict", a.verdict==="PASS"],
            ["failedGateCount", a.failedGateCount===0],
            ["skippedGateCount", a.skippedGateCount===0],
            ["notExecutedGateCount", a.notExecutedGateCount===0],
            ["gateCount", Array.isArray(a.requiredGates) && a.requiredGates.length===64],
            ["version", a.version==="0.9.0-ga-readiness"],
            ["status", a.status==="ga_readiness"],
            ["productionEngineeringOSReady", a.productionEngineeringOSReady===false],
            ["engineeringOSV1GaCertified", a.engineeringOSV1GaCertified===false],
            ["phase14BReady", a.phase14BReady===true],
            ["releaseEligible", a.releaseEligible===true],
            ["ProjectIntelligenceV1Intact", a.ProjectIntelligenceV1Intact===true],
            ["InspectionIntelligenceV1Intact", a.InspectionIntelligenceV1Intact===true],
            ["AssetIntelligenceV1Intact", a.AssetIntelligenceV1Intact===true],
            ["ProjectControlsV1Intact", a.ProjectControlsV1Intact===true],
            ["DigitalTwinV1Intact", a.DigitalTwinV1Intact===true],
            ["EngineeringModelInteroperabilityV1Intact", a.EngineeringModelInteroperabilityV1Intact===true],
            ["clientLicensedSolverExecutionArchitectureSupported", a.clientLicensedSolverExecutionArchitectureSupported===true],
            ["duplicateEngineeringToolFrameworkDetected", a.duplicateEngineeringToolFrameworkDetected===false],
            ["secretExposureDetected", a.secretExposureDetected===false],
            ["artifactIdentity", a.artifactCommitSha===a.ciHeadSha && a.ciHeadSha===a.buildIdentitySha],
          ];
          const failed = checks.filter(([, ok]) => !ok).map(([n]) => n);
          if (failed.length) {
            console.error("Assert failed:", failed);
            console.error(JSON.stringify({ failedGates: a.failedGates }, null, 2));
            process.exit(1);
          }
          console.log(JSON.stringify({
            verdict: a.verdict,
            version: a.version,
            phase14BReady: a.phase14BReady,
            productionEngineeringOSReady: a.productionEngineeringOSReady,
          }, null, 2));
          EOF
      - name: Upload certification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase14a-engineering-os-ga-readiness-certification
          path: packages/engineering-os-certification/artifacts/phase14a-engineering-os-ga-readiness-certification.json
          if-no-files-found: warn
