name: Phase 14C Enterprise Security Readiness

on:
  workflow_dispatch:
  push:
    branches: [master, main, release/**, cursor/**]
    paths:
      - "packages/engineering-os/**"
      - "packages/engineering-os-certification/**"
      - "packages/platform-certification/src/phase14c*"
      - "docs/security/RTB_*"
      - "docs/architecture/RTB_SECURITY_AND_ASSURANCE_BOUNDARY.md"
      - "docs/architecture/ENGINEERING_OS_PHASE_14C.md"
      - ".github/workflows/phase-14c-enterprise-security-readiness.yml"

concurrency:
  group: phase-14c-enterprise-security-readiness-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORM_CERTIFICATION: "1"
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch release tags
        run: git fetch --tags --force
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests (Engineering OS)
        run: pnpm --filter @rtb/engineering-os test
      - name: Architecture tests
        run: pnpm --filter @rtb/platform-certification exec -- vitest run src/phase14c-enterprise-security-readiness.test.ts
      - name: Secret scan
        run: pnpm --filter @rtb/engineering-os-certification secret-scan
      - name: Phase 14C certification (gates A–BL)
        run: pnpm --filter @rtb/engineering-os-certification certify:phase14c
      - name: Assert PASS artifact
        run: |
          node <<'EOF'
          const a = JSON.parse(require("fs").readFileSync("packages/engineering-os-certification/artifacts/phase14c-enterprise-security-readiness-certification.json","utf8"));
          const checks = [
            ["verdict", a.verdict==="PASS"],
            ["failedGateCount", a.failedGateCount===0],
            ["skippedGateCount", a.skippedGateCount===0],
            ["notExecutedGateCount", a.notExecutedGateCount===0],
            ["gateCount", Array.isArray(a.requiredGates) && a.requiredGates.length===64],
            ["version", a.version==="0.11.0-security-readiness"],
            ["status", a.status==="security_readiness"],
            ["productionEngineeringOSReady", a.productionEngineeringOSReady===false],
            ["engineeringOSV1GaCertified", a.engineeringOSV1GaCertified===false],
            ["engineeringOsSecurityGaGatePassed", a.engineeringOsSecurityGaGatePassed===false],
            ["securityClosureRequiredBeforeGa", a.securityClosureRequiredBeforeGa===true],
            ["EnterpriseSecurityAssessmentComplete", a.EnterpriseSecurityAssessmentComplete===true],
            ["knownCrossTenantLeakageDetected", a.knownCrossTenantLeakageDetected===false],
            ["secretExposureDetected", a.secretExposureDetected===false],
            ["iso27001Certified", a.iso27001Certified===false],
            ["soc2Assured", a.soc2Assured===false],
            ["essentialEightMaturityClaimed", a.essentialEightMaturityClaimed===false],
            ["externalPenetrationTestDocumented", a.externalPenetrationTestDocumented===false],
            ["releaseEligible", a.releaseEligible===true],
            ["phase14DReady", a.phase14DReady===true],
            ["artifactIdentity", a.artifactCommitSha===a.ciHeadSha && a.ciHeadSha===a.buildIdentitySha],
          ];
          const failed = checks.filter(([, ok]) => !ok).map(([n]) => n);
          if (failed.length) {
            console.error("Assert failed:", failed);
            console.error(JSON.stringify({ failedGates: a.failedGates }, null, 2));
            process.exit(1);
          }
          console.log(JSON.stringify({
            verdict: a.verdict,
            version: a.version,
            engineeringOsSecurityGaGatePassed: a.engineeringOsSecurityGaGatePassed,
            securityClosureRequiredBeforeGa: a.securityClosureRequiredBeforeGa,
            productionEngineeringOSReady: a.productionEngineeringOSReady,
          }, null, 2));
          EOF
      - name: Upload certification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase14c-enterprise-security-readiness-certification
          path: packages/engineering-os-certification/artifacts/phase14c-enterprise-security-readiness-certification.json
          if-no-files-found: warn
