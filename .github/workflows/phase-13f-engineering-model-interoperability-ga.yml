name: Phase 13F Engineering Model Interoperability V1.0 GA

on:
  workflow_dispatch:
  push:
    branches: [master, main, release/**, cursor/**]
    paths:
      - "packages/engineering-model-interoperability/**"
      - "packages/engineering-model-interoperability-certification/**"
      - "packages/engineering-execution-host/package.json"
      - "packages/engineering-execution-host/src/version.ts"
      - "packages/digital-twin/package.json"
      - "packages/digital-twin/src/version.ts"
      - "packages/platform-certification/src/phase13f*"
      - "packages/platform-commerce/src/domain/commerce-access-policy.ts"
      - "apps/web/src/app/api/engineering/model-interoperability/**"
      - "apps/web/src/app/(platform)/engineering/apps/model-interoperability/**"
      - "apps/web/src/app/(platform)/engineering/apps/execution-hosts/**"
      - "supabase/migrations/*engineering_model_interoperability*"
      - "supabase/migrations/*engineering_execution_hosts*"
      - "docs/architecture/ENGINEERING_MODEL_INTEROPERABILITY_V1_*"
      - "docs/architecture/ENGINEERING_MODEL_INTEROPERABILITY_PHASE_13F.md"
      - "docs/commercial/ENGINEERING_MODEL_INTEROPERABILITY_V1_*"
      - "docs/operations/ENGINEERING_MODEL_INTEROPERABILITY_V1_*"
      - "docs/release/ENGINEERING_MODEL_INTEROPERABILITY_V1_*"
      - ".github/workflows/phase-13f-engineering-model-interoperability-ga.yml"

concurrency:
  group: phase-13f-engineering-model-interoperability-ga-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORM_CERTIFICATION: "1"
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"
  CERTIFY_BROWSER: "1"
  CERTIFY_REQUIRE_HOSTED: "1"

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch release tags
        run: git fetch --tags --force
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @rtb/engineering-model-interoperability-certification exec playwright install chromium --with-deps
      - name: Unit tests
        run: pnpm --filter @rtb/engineering-model-interoperability test
      - name: Architecture tests
        run: pnpm --filter @rtb/platform-certification exec -- vitest run src/phase13f-engineering-model-interoperability-ga.test.ts
      - name: Secret scan
        run: pnpm --filter @rtb/engineering-model-interoperability-certification secret-scan
      - name: Browser GA gate
        run: pnpm --filter @rtb/engineering-model-interoperability-certification test:e2e:v1
      - name: Phase 13F certification (gates A–BT)
        env:
          CERTIFY_BROWSER: "1"
          CERTIFY_REQUIRE_HOSTED: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm --filter @rtb/engineering-model-interoperability-certification certify:phase13f
      - name: Assert PASS artifact
        run: |
          node <<'EOF'
          const a = JSON.parse(require("fs").readFileSync("packages/engineering-model-interoperability-certification/artifacts/phase13f-engineering-model-interoperability-v1-ga-certification.json","utf8"));
          const checks = [
            ["verdict", a.verdict==="PASS"],
            ["failedGateCount", a.failedGateCount===0],
            ["skippedGateCount", a.skippedGateCount===0],
            ["notExecutedGateCount", a.notExecutedGateCount===0],
            ["gateCount", Array.isArray(a.requiredGates) && a.requiredGates.length===72],
            ["version", a.version==="1.0.0"],
            ["status", a.status==="ga"],
            ["releaseTag", a.releaseTag==="engineering-model-interoperability-v1.0.0"],
            ["phase13DStatus", a.phase13DStatus==="blocked_external_dependency"],
            ["batch90Created", a.batch90Created===false],
            ["SPACEGASSLiveProviderReady", a.SPACEGASSLiveProviderReady===false],
            ["SPACEGASSLiveExecutionCertified", a.SPACEGASSLiveExecutionCertified===false],
            ["ETABSHostedExecutionCertified", a.ETABSHostedExecutionCertified===false],
            ["ETABSControlledExecutionCertified", a.ETABSControlledExecutionCertified===false],
            ["DigitalTwinV1Intact", a.DigitalTwinV1Intact===true],
            ["EngineeringModelInteroperabilityV1GaCertified", a.EngineeringModelInteroperabilityV1GaCertified===true],
            ["EngineeringModelInteroperabilityV1Frozen", a.EngineeringModelInteroperabilityV1Frozen===true],
            ["moduleRegistryDriftDetected", a.moduleRegistryDriftDetected===false],
            ["silentSolverFallbackAllowed", a.silentSolverFallbackAllowed===false],
            ["releaseEligible", a.releaseEligible===true],
            ["artifactCommitSha", a.artifactCommitSha===a.ciHeadSha],
            ["unexpected5xx", a.unexpected5xx===0],
            ["secretExposureDetected", a.secretExposureDetected===false],
          ];
          const failed = checks.filter(([, ok]) => !ok).map(([n]) => n);
          if (failed.length) {
            console.error("Assert failed:", failed);
            console.error(JSON.stringify({ failedGates: a.failedGates }, null, 2));
            process.exit(1);
          }
          console.log(JSON.stringify({
            verdict: a.verdict,
            version: a.version,
            releaseTag: a.releaseTag,
            phase13DStatus: a.phase13DStatus,
            batch90Created: a.batch90Created,
            tagToCreate: a.tagToCreate,
          }, null, 2));
          EOF
      - name: Upload certification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase13f-engineering-model-interoperability-v1-ga-certification
          path: packages/engineering-model-interoperability-certification/artifacts/phase13f-engineering-model-interoperability-v1-ga-certification.json
          if-no-files-found: warn
