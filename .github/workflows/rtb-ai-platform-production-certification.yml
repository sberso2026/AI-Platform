name: RTB AI Platform Production Certification

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - release/**
    paths:
      - "packages/platform-certification/**"
      - "packages/reference-os/**"
      - "packages/platform-core/**"
      - "packages/platform-commerce/src/services/lifecycle-observability.ts"
      - "packages/types/src/os-runtime.ts"
      - "apps/web/src/app/(platform)/platform/home/**"
      - "apps/web/src/app/(platform)/reference-os/**"
      - "docs/architecture/RTB_AI_PLATFORM_*.md"
      - "docs/testing/RTB_AI_PLATFORM_*.md"
      - "supabase/migrations/*reference_os*"
      - ".github/workflows/rtb-ai-platform-production-certification.yml"

concurrency:
  group: rtb-ai-platform-cert-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORM_CERTIFICATION: "1"
  PLATFORM_CERTIFICATION_TARGET: hosted_staging
  ALLOW_PRODUCTION_CERTIFICATION: "false"
  PNPM_VERSION: "9.15.0"
  NODE_VERSION: "22"
  GITHUB_RUN_ID: ${{ github.run_id }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: CI preflight
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm --filter @rtb/platform-certification ci-preflight

  validate:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit gates
        run: pnpm --filter @rtb/platform-certification test:unit
      - name: Platform-core nav regression
        run: pnpm --filter @rtb/platform-core test -- src/nav-visibility.test.ts

  hosted-fixture:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Provision dual-OS fixture
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CERT_USER_PASSWORD: ${{ secrets.CERT_USER_PASSWORD }}
        run: pnpm --filter @rtb/platform-certification provision
      - uses: actions/upload-artifact@v4
        with:
          name: platform-7b-fixtures
          path: packages/platform-certification/artifacts/platform-7b-fixtures.json

  hosted-rls:
    needs: hosted-fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Hosted schema verification
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm --filter @rtb/installation-certification verify-hosted-schema

  platform-only:
    needs: [hosted-fixture, hosted-rls]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Platform-only readiness covered in certify browser gates (rtb-ai-platform-ready)"

  engineering-os-install:
    needs: hosted-fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Engineering OS active install seeded in hosted-fixture"

  reference-os-install:
    needs: hosted-fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "reference-os active install seeded in hosted-fixture"

  multi-os-isolation:
    needs: [engineering-os-install, reference-os-install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Multi-OS unit isolation
        run: pnpm --filter @rtb/platform-certification exec vitest run src/phase7b-multi-os.test.ts

  browser-certification:
    needs: [platform-only, multi-os-isolation]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: platform-7b-fixtures
          path: packages/platform-certification/artifacts
      - name: Install Playwright
        run: pnpm --filter @rtb/platform-certification exec playwright install chromium --with-deps
      - name: Full hosted certify (server + browser + cleanup)
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CERT_USER_PASSWORD: ${{ secrets.CERT_USER_PASSWORD }}
          COMMERCE_AUTH_SECRET: ${{ secrets.COMMERCE_AUTH_SECRET }}
          COMMERCE_SCHEDULER_SECRET: ${{ secrets.COMMERCE_SCHEDULER_SECRET }}
        run: pnpm --filter @rtb/platform-certification certify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-certification
          path: |
            packages/platform-certification/artifacts/platform-certification.json
            packages/platform-certification/artifacts/cleanup-report.json
            packages/platform-certification/artifacts/platform-7b-fixtures.json
            packages/platform-certification/artifacts/lifecycle-event-summary.json
            packages/platform-certification/test-results/
            packages/platform-certification/playwright-report/
          if-no-files-found: warn

  accessibility:
    needs: browser-certification
    if: always() && needs.browser-certification.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: platform-certification
          path: artifacts
      - name: Verify accessibility gate Q
        run: |
          node -e "
            const fs=require('fs');
            const path=fs.existsSync('artifacts/platform-certification.json')
              ? 'artifacts/platform-certification.json'
              : 'artifacts/artifacts/platform-certification.json';
            const a=JSON.parse(fs.readFileSync(path,'utf8'));
            const q=a.gates.find(g=>g.id==='Q');
            if(!q || q.status!=='pass') { console.error(q); process.exit(1); }
            console.log('accessibility gate Q pass');
          "

  responsive:
    needs: browser-certification
    if: always() && needs.browser-certification.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: platform-certification
          path: artifacts
      - name: Verify responsive gate R
        run: |
          node -e "
            const fs=require('fs');
            const path=fs.existsSync('artifacts/platform-certification.json')
              ? 'artifacts/platform-certification.json'
              : 'artifacts/artifacts/platform-certification.json';
            const a=JSON.parse(fs.readFileSync(path,'utf8'));
            const r=a.gates.find(g=>g.id==='R');
            if(!r || r.status!=='pass') { console.error(r); process.exit(1); }
            console.log('responsive gate R pass');
          "

  cleanup-verification:
    needs: browser-certification
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: platform-certification
          path: artifacts
      - name: Verify cleanup report
        run: |
          node -e "
            const fs=require('fs');
            const path=fs.existsSync('artifacts/platform-certification.json')
              ? 'artifacts/platform-certification.json'
              : 'artifacts/artifacts/platform-certification.json';
            const a=JSON.parse(fs.readFileSync(path,'utf8'));
            const t=a.gates.find(g=>g.id==='T');
            if(!t || t.status!=='pass') { console.error(t); process.exit(1); }
            console.log('cleanup gate T pass');
          "

  release-evidence:
    needs: [cleanup-verification, accessibility, responsive]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: platform-certification
          path: artifacts
      - name: Verify releaseEligible and SHA match
        run: |
          node -e "
            const fs = require('fs');
            const path=fs.existsSync('artifacts/platform-certification.json')
              ? 'artifacts/platform-certification.json'
              : 'artifacts/artifacts/platform-certification.json';
            const a = JSON.parse(fs.readFileSync(path,'utf8'));
            console.log(JSON.stringify({
              verdict: a.verdict,
              releaseEligible: a.releaseEligible,
              platformName: a.platformName,
              ciHeadSha: a.ciHeadSha,
              artifactCommitSha: a.artifactCommitSha,
              buildIdentitySha: a.buildIdentitySha,
              failedGates: a.failedGates,
              notExecutedGates: a.notExecutedGates,
              microsoftTeamsLiveConnector: a.microsoftTeamsLiveConnector,
            }, null, 2));
            if (a.verdict !== 'PASS' || !a.releaseEligible) process.exit(1);
            if (a.artifactCommitSha !== a.ciHeadSha || a.ciHeadSha !== a.buildIdentitySha) process.exit(1);
            if ((a.notExecutedGates||[]).length) process.exit(1);
            if (a.requiredTestsSkipped !== 0 || a.unexpected5xx !== 0 || a.secretExposureDetected) process.exit(1);
          "
