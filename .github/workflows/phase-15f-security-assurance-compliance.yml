name: Phase 15F Security & Assurance Compliance Intelligence

on:
  workflow_dispatch:
  push:
    branches: [master, main, release/**, cursor/**]
    paths:
      - "packages/security-assurance/**"
      - "packages/security-assurance-certification/**"
      - "packages/platform-certification/src/phase15f*"
      - "apps/web/src/app/(platform)/platform/security-assurance/**"
      - "supabase/migrations/20260808330000_batch_94_security_assurance_compliance.sql"
      - "docs/security/SECURITY_ASSURANCE_*"
      - "docs/architecture/SECURITY_ASSURANCE_PHASE_15F.md"
      - ".github/workflows/phase-15f-security-assurance-compliance.yml"

concurrency:
  group: phase-15f-security-assurance-compliance-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORM_CERTIFICATION: "1"
  CERTIFY_BROWSER: "1"
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch release tags
        run: git fetch --tags --force
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @rtb/security-assurance-certification exec playwright install --with-deps chromium
      - name: Unit tests
        run: pnpm --filter @rtb/security-assurance test
      - name: Architecture tests
        run: pnpm --filter @rtb/platform-certification exec -- vitest run src/phase15a-security-assurance-discovery.test.ts src/phase15b-security-assurance-foundation.test.ts src/phase15c-security-assurance-isolation.test.ts src/phase15d-security-assurance-ai-data.test.ts src/phase15e-security-assurance-secure-compute.test.ts src/phase15f-security-assurance-compliance.test.ts
      - name: Secret scan
        run: pnpm --filter @rtb/security-assurance-certification secret-scan
      - name: Phase 15F certification (gates A–BR)
        run: pnpm --filter @rtb/security-assurance-certification certify:phase15f
      - name: Assert PASS artifact
        run: |
          node <<'EOF'
          const a = JSON.parse(require("fs").readFileSync("packages/security-assurance-certification/artifacts/phase15f-security-assurance-compliance-certification.json","utf8"));
          const checks = [
            ["verdict", a.verdict==="PASS"],
            ["failedGateCount", a.failedGateCount===0],
            ["skippedGateCount", a.skippedGateCount===0],
            ["notExecutedGateCount", a.notExecutedGateCount===0],
            ["gateCount", Array.isArray(a.requiredGates) && a.requiredGates.length===70],
            ["version", a.version==="0.6.0-compliance-intelligence"],
            ["status", a.status==="compliance_intelligence"],
            ["ComplianceIntelligenceReady", a.ComplianceIntelligenceReady===true],
            ["ComplianceIntelligenceImplemented", a.ComplianceIntelligenceImplemented===true],
            ["duplicateSecurityControlRegistryDetected", a.duplicateSecurityControlRegistryDetected===false],
            ["automaticCertificationEnabled", a.automaticCertificationEnabled===false],
            ["automaticComplianceClaimEnabled", a.automaticComplianceClaimEnabled===false],
            ["EngineeringOSV1Intact", a.EngineeringOSV1Intact===true],
            ["phase15GReady", a.phase15GReady===true],
            ["releaseEligible", a.releaseEligible===true],
            ["secretExposureDetected", a.secretExposureDetected===false],
            ["artifactIdentity", a.artifactCommitSha===a.ciHeadSha && a.ciHeadSha===a.buildIdentitySha],
          ];
          const failed = checks.filter(([, ok]) => !ok).map(([n]) => n);
          if (failed.length) {
            console.error("Assert failed:", failed);
            process.exit(1);
          }
          console.log("Phase 15F assert PASS");
          EOF
      - name: Upload certification artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase15f-security-assurance-compliance-certification
          path: packages/security-assurance-certification/artifacts/phase15f-security-assurance-compliance-certification.json
