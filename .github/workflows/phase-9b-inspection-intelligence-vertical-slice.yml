name: Phase 9B Inspection Intelligence Vertical Slice

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - release/**
      - cursor/**
    paths:
      - "packages/inspection-intelligence/**"
      - "packages/inspection-intelligence-certification/**"
      - "packages/engineering-os/src/module-registry.ts"
      - "packages/platform-certification/src/phase9b*"
      - "packages/platform-commerce/src/domain/commerce-access-policy.ts"
      - "apps/web/src/app/**/inspection-intelligence/**"
      - "apps/web/src/app/api/engineering/inspection-intelligence/**"
      - "apps/web/src/components/engineering/inspection-intelligence-shell.tsx"
      - "supabase/migrations/*inspection_intelligence*"
      - "docs/architecture/INSPECTION_INTELLIGENCE*"
      - ".github/workflows/phase-9b-inspection-intelligence-vertical-slice.yml"

concurrency:
  group: phase-9b-inspection-slice-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORM_CERTIFICATION: "1"
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch release tags
        run: git fetch --tags --force

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Inspection Intelligence unit + slice tests
        run: pnpm --filter @rtb/inspection-intelligence test

      - name: Architecture boundary tests
        run: pnpm --filter @rtb/platform-certification exec vitest run src/phase9b-inspection-vertical-slice.test.ts

      - name: Phase 9B certification (gates A–S)
        run: pnpm --filter @rtb/inspection-intelligence-certification certify:phase9b

      - name: Assert PASS artifact
        run: |
          node <<'EOF'
          const { readFileSync } = require("fs");
          const path = "packages/inspection-intelligence-certification/artifacts/phase9b-inspection-intelligence-vertical-slice-certification.json";
          const a = JSON.parse(readFileSync(path, "utf8"));
          const checks = [
            ["verdict", a.verdict === "PASS"],
            ["failedGateCount", a.failedGateCount === 0],
            ["skippedGateCount", a.skippedGateCount === 0],
            ["notExecutedGateCount", a.notExecutedGateCount === 0],
            ["requiredTestsSkipped", a.requiredTestsSkipped === 0],
            ["secretExposureDetected", a.secretExposureDetected === false],
            ["releaseTagMoved", a.releaseTagMoved === false],
            ["releaseEligible", a.releaseEligible === true],
            ["projectIntelligenceV1Intact", a.projectIntelligenceV1Intact === true],
            ["verticalSliceReady", a.verticalSliceReady === true],
            ["phase9CReady", a.phase9CReady === true],
            ["architecturalReservationsLocked", a.architecturalReservationsLocked === true],
            ["aiVisionImplemented", a.aiVisionImplemented === false],
            ["predictiveImplemented", a.predictiveImplemented === false],
            ["mobileProductImplemented", a.mobileProductImplemented === false],
            ["gatesExecuted", Array.isArray(a.requiredGates) && a.requiredGates.length === 19],
            ["artifactMatch", a.artifactCommitSha === a.buildIdentitySha],
          ];
          const failed = checks.filter(([, ok]) => !ok).map(([n]) => n);
          if (failed.length) {
            console.error("Assert failed:", failed);
            console.error(JSON.stringify(a, null, 2));
            process.exit(1);
          }
          console.log(JSON.stringify({
            verdict: a.verdict,
            phase9CReady: a.phase9CReady,
            verticalSliceReady: a.verticalSliceReady,
            version: a.version,
          }, null, 2));
          EOF

      - name: Upload certification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase9b-inspection-intelligence-vertical-slice-certification
          path: packages/inspection-intelligence-certification/artifacts/phase9b-inspection-intelligence-vertical-slice-certification.json
          if-no-files-found: error
