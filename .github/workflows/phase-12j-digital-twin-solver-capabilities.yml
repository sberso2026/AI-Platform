name: Phase 12J Digital Twin Solver Capabilities

on:
  workflow_dispatch:
  push:
    branches: [master, main, release/**, cursor/**]
    paths:
      - "packages/digital-twin/**"
      - "packages/digital-twin-certification/**"
      - "packages/platform-certification/src/phase12j*"
      - "supabase/migrations/*batch_83*"
      - "apps/web/src/app/api/engineering/digital-twin/**"
      - "apps/web/src/app/(platform)/engineering/apps/digital-twin/**"
      - "docs/architecture/DIGITAL_TWIN_*CAPABILITY*"
      - "docs/architecture/DIGITAL_TWIN_PHASE_12J*"
      - ".github/workflows/phase-12j-digital-twin-solver-capabilities.yml"

concurrency:
  group: phase-12j-digital-twin-solver-capabilities-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORM_CERTIFICATION: "1"
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"
  CERTIFY_BROWSER: "1"
  REAL_SOLVER_HOSTED: "1"

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch release tags
        run: git fetch --tags --force
      - name: Install CalculiX (ccx)
        run: sudo apt-get update && sudo apt-get install -y calculix-ccx
      - name: Verify CalculiX binary
        run: |
          which ccx
          ccx -v || true
          command -v ccx
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm --filter @rtb/digital-twin test
      - name: Architecture tests
        run: pnpm --filter @rtb/platform-certification exec vitest run src/phase12j-digital-twin-solver-capabilities.test.ts
      - name: Secret scan
        run: pnpm --filter @rtb/digital-twin-certification secret-scan
      - name: Install Playwright Chromium
        run: pnpm --filter @rtb/digital-twin-certification exec playwright install --with-deps chromium
      - name: Browser E2E solver capabilities (CERTIFY_BROWSER=1)
        run: pnpm --filter @rtb/digital-twin-certification test:e2e:solver-capabilities
      - name: Phase 12J certification (gates A–BZ)
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          CERT_USER_PASSWORD: ${{ secrets.CERT_USER_PASSWORD }}
          CERTIFY_BROWSER: "1"
          REAL_SOLVER_HOSTED: "1"
        run: pnpm --filter @rtb/digital-twin-certification certify:phase12j
      - name: Assert PASS artifact
        run: |
          node <<'EOF'
          const a = JSON.parse(require("fs").readFileSync("packages/digital-twin-certification/artifacts/phase12j-digital-twin-solver-capabilities-certification.json","utf8"));
          const checks = [
            ["verdict", a.verdict==="PASS"],
            ["failedGateCount", a.failedGateCount===0],
            ["skippedGateCount", a.skippedGateCount===0],
            ["notExecutedGateCount", a.notExecutedGateCount===0],
            ["gateCount", Array.isArray(a.requiredGates) && a.requiredGates.length===78],
            ["version", a.version==="0.10.0-solver-capabilities"],
            ["status", a.status==="solver_capabilities"],
            ["digitalTwinImplemented", a.digitalTwinImplemented===true],
            ["productionDigitalTwinReady", a.productionDigitalTwinReady===false],
            ["solverCapabilityRegistryReady", a.solverCapabilityRegistryReady===true],
            ["SolverCapabilityRegistryReady", a.SolverCapabilityRegistryReady===true],
            ["providerCompatibilityMatrixReady", a.providerCompatibilityMatrixReady===true],
            ["capabilityDiscoveryReady", a.capabilityDiscoveryReady===true],
            ["simulationPackageExtended", a.simulationPackageExtended===true],
            ["fourLayerQualificationIntact", a.fourLayerQualificationIntact===true],
            ["realSolverExecutionCertified", a.realSolverExecutionCertified===true],
            ["calculixAdapterIntact", a.calculixAdapterIntact===true],
            ["externalSolverAdapterFrameworkReady", a.externalSolverAdapterFrameworkReady===true],
            ["firstRealEngineeringSolverAdapterImplemented", a.firstRealEngineeringSolverAdapterImplemented===true],
            ["silentSolverFallbackAllowed", a.silentSolverFallbackAllowed===false],
            ["realSolverHostedExecutionCertified", a.realSolverHostedExecutionCertified===true],
            ["externalEngineeringSolverAdaptersImplemented", a.externalEngineeringSolverAdaptersImplemented===true],
            ["nativeEngineeringSolverImplemented", a.nativeEngineeringSolverImplemented===false],
            ["simulationExecutionImplemented", a.simulationExecutionImplemented===true],
            ["simulationOptimizationImplemented", a.simulationOptimizationImplemented===false],
            ["automaticSimulationApprovalEnabled", a.automaticSimulationApprovalEnabled===false],
            ["predictiveTwinImplemented", a.predictiveTwinImplemented===false],
            ["shmRuntimeImplemented", a.shmRuntimeImplemented===false],
            ["spatialOwnershipFullyResolved", a.spatialOwnershipFullyResolved===false],
            ["duplicateEngineeringToolFrameworkDetected", a.duplicateEngineeringToolFrameworkDetected===false],
            ["duplicateSolverOwnershipDetected", a.duplicateSolverOwnershipDetected===false],
            ["phase12HReady", a.phase12HReady===true],
            ["phase12IReady", a.phase12IReady===true],
            ["phase12JReady", a.phase12JReady===true],
            ["phase12KReady", a.phase12KReady===true],
            ["releaseEligible", a.releaseEligible===true],
            ["publicContractVersion", a.publicContractVersion==="0.10.0-solver-capabilities-draft"],
            ["unexpected5xx", a.unexpected5xx===0],
          ];
          const failed = checks.filter(([, ok]) => !ok).map(([n]) => n);
          if (failed.length) {
            console.error("Assert failed:", failed);
            console.error(JSON.stringify({ failedGates: a.failedGates }, null, 2));
            process.exit(1);
          }
          console.log(JSON.stringify({ verdict: a.verdict, version: a.version, gateCount: a.gateCount }, null, 2));
          EOF
      - name: Upload certification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase12j-digital-twin-solver-capabilities-certification
          path: packages/digital-twin-certification/artifacts/phase12j-digital-twin-solver-capabilities-certification.json
