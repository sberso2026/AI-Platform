name: Phase 12L Shared Spatial Domain Discovery

on:
  workflow_dispatch:
  push:
    branches: [master, main, release/**, cursor/**]
    paths:
      - "packages/engineering-shared-spatial-domain/**"
      - "packages/engineering-shared-spatial-domain-certification/**"
      - "packages/digital-twin/src/version.ts"
      - "packages/digital-twin/src/architecture/ownership-lock.ts"
      - "packages/digital-twin/src/domain/spatial-reference.ts"
      - "packages/platform-certification/src/phase12l*"
      - "docs/architecture/ENGINEERING_SHARED_SPATIAL_DOMAIN_*"
      - "docs/architecture/adr/ADR_SHARED_SPATIAL_*"
      - "docs/architecture/adr/ADR_TWIN_SPATIAL_*"
      - "docs/contracts/ENGINEERING_SHARED_SPATIAL_DOMAIN_*"
      - ".github/workflows/phase-12l-shared-spatial-domain-discovery.yml"

concurrency:
  group: phase-12l-shared-spatial-domain-discovery-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORM_CERTIFICATION: "1"
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch release tags
        run: git fetch --tags --force
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests (shared spatial discovery)
        run: pnpm --filter @rtb/engineering-shared-spatial-domain test
      - name: Digital Twin regression (ownership lock)
        run: pnpm --filter @rtb/digital-twin test -- tests/discovery-lock.test.ts
      - name: Architecture tests
        run: pnpm --filter @rtb/platform-certification exec -- vitest run src/phase12l-shared-spatial-domain-discovery.test.ts
      - name: Secret scan
        run: pnpm --filter @rtb/engineering-shared-spatial-domain-certification secret-scan
      - name: Phase 12L certification (gates A–BE)
        run: pnpm --filter @rtb/engineering-shared-spatial-domain-certification certify:phase12l
      - name: Assert PASS artifact
        run: |
          node <<'EOF'
          const a = JSON.parse(require("fs").readFileSync("packages/engineering-shared-spatial-domain-certification/artifacts/phase12l-shared-spatial-domain-discovery-certification.json","utf8"));
          const checks = [
            ["verdict", a.verdict==="PASS"],
            ["failedGateCount", a.failedGateCount===0],
            ["skippedGateCount", a.skippedGateCount===0],
            ["notExecutedGateCount", a.notExecutedGateCount===0],
            ["gateCount", Array.isArray(a.requiredGates) && a.requiredGates.length===57],
            ["version", a.version==="0.1.0-spatial-discovery"],
            ["status", a.status==="discovery"],
            ["SharedSpatialDomainDiscoveryReady", a.SharedSpatialDomainDiscoveryReady===true],
            ["SharedSpatialDomainOwnershipLocked", a.SharedSpatialDomainOwnershipLocked===true],
            ["SharedSpatialDomainRuntimeImplemented", a.SharedSpatialDomainRuntimeImplemented===false],
            ["spatialOwnershipFullyResolved", a.spatialOwnershipFullyResolved===false],
            ["coordinateTransformationImplemented", a.coordinateTransformationImplemented===false],
            ["gisRuntimeImplemented", a.gisRuntimeImplemented===false],
            ["spatialAnalyticsImplemented", a.spatialAnalyticsImplemented===false],
            ["duplicateSpatialOwnershipDetected", a.duplicateSpatialOwnershipDetected===false],
            ["duplicateGeometryOwnershipDetected", a.duplicateGeometryOwnershipDetected===false],
            ["digitalTwinMayOwnCanonicalSpatial", a.digitalTwinMayOwnCanonicalSpatial===false],
            ["digitalTwinVersion", a.digitalTwinVersion==="0.11.0-digital-thread"],
            ["productionDigitalTwinReady", a.productionDigitalTwinReady===false],
            ["projectControlsV1Intact", a.projectControlsV1Intact===true],
            ["projectControlsV1TagNotMoved", a.projectControlsV1TagMoved===false],
            ["assetIntelligenceV1Intact", a.assetIntelligenceV1Intact===true],
            ["projectIntelligenceV1Intact", a.projectIntelligenceV1Intact===true],
            ["inspectionIntelligenceV1Intact", a.inspectionIntelligenceV1Intact===true],
            ["publicContractVersion", a.publicContractVersion==="0.1.0-draft"],
            ["secretExposureDetected", a.secretExposureDetected===false],
            ["phase12MReady", a.phase12MReady===true],
            ["releaseEligible", a.releaseEligible===true],
          ];
          const failed = checks.filter(([, ok]) => !ok).map(([n]) => n);
          if (failed.length) {
            console.error("Assert failed:", failed);
            console.error(JSON.stringify({ failedGates: a.failedGates }, null, 2));
            process.exit(1);
          }
          console.log(JSON.stringify({
            verdict: a.verdict,
            version: a.version,
            spatialOwnershipFullyResolved: a.spatialOwnershipFullyResolved,
            phase12MReady: a.phase12MReady,
          }, null, 2));
          EOF
      - name: Upload certification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase12l-shared-spatial-domain-discovery-certification
          path: packages/engineering-shared-spatial-domain-certification/artifacts/phase12l-shared-spatial-domain-discovery-certification.json
          if-no-files-found: warn
