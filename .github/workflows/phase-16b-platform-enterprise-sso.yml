name: Phase 16B Platform Enterprise SSO

on:
  workflow_dispatch:
  push:
    branches: [master, main, release/**, cursor/**]
    paths:
      - "packages/platform-identity/**"
      - "packages/platform-identity-certification/**"
      - "packages/platform-certification/src/phase16*"
      - "packages/security-assurance/src/customer-assurance-flags.ts"
      - "apps/web/src/app/(auth)/login/**"
      - "apps/web/src/app/(platform)/platform/enterprise-sso/**"
      - "apps/web/src/app/api/platform/enterprise-sso/**"
      - "supabase/migrations/20260808350000_batch_96_platform_enterprise_identity_oidc.sql"
      - "docs/architecture/PLATFORM_IDENTITY_PHASE_16B.md"
      - "docs/operations/PLATFORM_ENTERPRISE_SSO_OPERATIONS.md"
      - "docs/identity/PLATFORM_ENTERPRISE_IDENTITY_PUBLIC_CONTRACTS_0_2_0.md"
      - ".github/workflows/phase-16b-platform-enterprise-sso.yml"

concurrency:
  group: phase-16b-platform-enterprise-sso-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORM_CERTIFICATION: "1"
  CERTIFY_BROWSER: "1"
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch release tags
        run: git fetch --tags --force
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @rtb/platform-identity-certification exec playwright install --with-deps chromium
      - name: Unit tests
        run: pnpm --filter @rtb/platform-identity test
      - name: Architecture tests
        run: pnpm --filter @rtb/platform-certification exec -- vitest run src/phase16a-platform-enterprise-sso-discovery.test.ts src/phase16b-platform-enterprise-sso.test.ts
      - name: Secret scan
        run: pnpm --filter @rtb/platform-identity-certification secret-scan
      - name: Phase 16B certification
        run: pnpm --filter @rtb/platform-identity-certification certify:phase16b
      - name: Assert PASS artifact
        run: |
          node <<'EOF'
          const a = JSON.parse(require("fs").readFileSync("packages/platform-identity-certification/artifacts/phase16b-platform-enterprise-sso-certification.json","utf8"));
          const checks = [
            ["verdict", a.verdict==="PASS"],
            ["failedGateCount", a.failedGateCount===0],
            ["skippedGateCount", a.skippedGateCount===0],
            ["notExecutedGateCount", a.notExecutedGateCount===0],
            ["requiredTestsSkipped", a.requiredTestsSkipped===0],
            ["gateCount", Array.isArray(a.requiredGates) && a.requiredGates.length===65],
            ["version", a.version==="0.2.0-enterprise-sso" || a.version==="0.3.0-pen-test-readiness" || a.version==="0.3.1-internal-adversarial"],
            ["EnterpriseSsoRuntimeImplemented", a.EnterpriseSsoRuntimeImplemented===true],
            ["S08CustomerSsoProductionReady", a.S08CustomerSsoProductionReady===true],
            ["CustomerSsoProductionReady", a.CustomerSsoProductionReady===true],
            ["S07ExternalPenTestComplete", a.S07ExternalPenTestComplete===false],
            ["Tier1EnterpriseProductionReady", a.Tier1EnterpriseProductionReady===false],
            ["nearFinalTier1AttackSurfaceReadyForExternalPenTest", a.nearFinalTier1AttackSurfaceReadyForExternalPenTest===true],
            ["passwordFallbackWhenRequired", a.passwordFallbackWhenRequired===false],
            ["knownEnterpriseIdentityCrossTenantLeakageDetected", a.knownEnterpriseIdentityCrossTenantLeakageDetected===false],
            ["SamlFederationImplemented", a.SamlFederationImplemented===false],
            ["ScimProvisioningImplemented", a.ScimProvisioningImplemented===false],
            ["LiveEntraIntegrationImplemented", a.LiveEntraIntegrationImplemented===false],
            ["SecurityAssuranceV1Intact", a.SecurityAssuranceV1Intact===true],
            ["EngineeringOSV1Intact", a.EngineeringOSV1Intact===true],
            ["phase16CReady", a.phase16CReady===true],
            ["releaseEligible", a.releaseEligible===true],
            ["secretExposureDetected", a.secretExposureDetected===false],
            ["artifactIdentity", a.artifactCommitSha===a.ciHeadSha && a.ciHeadSha===a.buildIdentitySha],
          ];
          const failed = checks.filter(([, ok]) => !ok).map(([n]) => n);
          if (failed.length) {
            console.error("Assert failed:", failed);
            console.error(JSON.stringify({ failedGates: a.failedGates }, null, 2));
            process.exit(1);
          }
          console.log("Phase 16B assert PASS");
          EOF
      - name: Upload certification artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase16b-platform-enterprise-sso-certification
          path: packages/platform-identity-certification/artifacts/phase16b-platform-enterprise-sso-certification.json
