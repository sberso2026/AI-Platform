name: Phase 11N Project Controls V1.0 GA

on:
  workflow_dispatch:
  push:
    branches: [master, main, release/**, cursor/**]
    paths:
      - "packages/project-controls/**"
      - "packages/project-controls-certification/**"
      - "packages/platform-certification/src/phase11n*"
      - "packages/platform-commerce/src/domain/commerce-access-policy.ts"
      - "supabase/migrations/*project_controls*"
      - "supabase/migrations/*shared_project*"
      - "apps/web/src/app/api/engineering/project-controls/**"
      - "apps/web/src/app/(platform)/engineering/apps/project-controls/**"
      - "apps/web/src/components/engineering/project-controls-shell.tsx"
      - ".github/workflows/phase-11n-project-controls-ga.yml"
      - "docs/release/PROJECT_CONTROLS_V1_*"
      - "docs/runbooks/PROJECT_CONTROLS_V1_*"
      - "docs/architecture/PROJECT_CONTROLS_V1_*"
      - "docs/commercial/PROJECT_CONTROLS_V1_*"

concurrency:
  group: phase-11n-project-controls-ga-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"
  CERTIFY_BROWSER: "1"

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --tags --force
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright chromium
        run: pnpm --filter @rtb/project-controls-certification exec playwright install --with-deps chromium
      - name: Unit tests
        run: pnpm --filter @rtb/project-controls test
      - name: Architecture tests
        run: pnpm --filter @rtb/platform-certification exec vitest run src/phase11n-project-controls-ga.test.ts
      - name: Browser GA gate
        run: pnpm --filter @rtb/project-controls-certification test:e2e:v1
      - name: Phase 11N certification (gates A–BM)
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          CERT_USER_PASSWORD: ${{ secrets.CERT_USER_PASSWORD }}
        run: pnpm --filter @rtb/project-controls-certification certify:phase11n
      - name: Assert PASS artifact
        run: |
          node <<'EOF'
          const a = JSON.parse(require("fs").readFileSync("packages/project-controls-certification/artifacts/phase11n-project-controls-v1-ga-certification.json","utf8"));
          const checks = [
            a.verdict==="PASS",
            a.failedGateCount===0,
            a.skippedGateCount===0,
            a.notExecutedGateCount===0,
            a.requiredGates.length===65,
            a.version==="1.0.0",
            a.status==="ga",
            a.releaseTag==="project-controls-v1.0.0",
            a.productionProjectControlsReady===true,
            a.projectControlsV1GaCertified===true,
            a.projectControlsV1Frozen===true,
            a.projectControlsBackupRestoreCertified===true,
            a.moduleRegistryDriftDetected===false,
            a.automaticDecisionExecutionEnabled===false,
            a.automaticLearningApprovalEnabled===false,
            a.automaticKnowledgeMutationEnabled===false,
            a.cpmSchedulingImplemented===false,
            a.financialPostingImplemented===false,
            a.earnedValueImplemented===false,
            a.releaseEligible===true,
            a.artifactCommitSha===a.ciHeadSha,
          ];
          if (checks.some(x=>!x)) { console.error(a); process.exit(1); }
          console.log(JSON.stringify({ verdict:a.verdict, version:a.version, releaseTag:a.releaseTag },null,2));
          EOF
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase11n-project-controls-v1-ga-certification
          path: packages/project-controls-certification/artifacts/phase11n-project-controls-v1-ga-certification.json
          if-no-files-found: warn
