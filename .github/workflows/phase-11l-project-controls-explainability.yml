name: Phase 11L Project Controls Explainability Intelligence

on:
  workflow_dispatch:
  push:
    branches: [master, main, release/**, cursor/**]
    paths:
      - "packages/project-controls/**"
      - "packages/project-controls-certification/**"
      - "packages/engineering-shared-project-domain/**"
      - "packages/platform-certification/src/phase11l*"
      - "supabase/migrations/*batch_72*"
      - "apps/web/src/app/api/engineering/project-controls/**"
      - "docs/architecture/PROJECT_CONTROLS_*"
      - ".github/workflows/phase-11l-project-controls-explainability.yml"

concurrency:
  group: phase-11l-project-controls-explainability-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORM_CERTIFICATION: "1"
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch release tags
        run: git fetch --tags --force
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Shared project domain unit tests
        run: pnpm --filter @rtb/engineering-shared-project-domain test
      - name: Project Controls unit tests
        run: pnpm --filter @rtb/project-controls test
      - name: Architecture tests
        run: pnpm --filter @rtb/platform-certification exec -- vitest run src/phase11l-project-controls-explainability.test.ts
      - name: Secret scan
        run: pnpm --filter @rtb/project-controls-certification secret-scan
      - name: Phase 11L certification (gates A–BC)
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          CERT_USER_PASSWORD: ${{ secrets.CERT_USER_PASSWORD }}
        run: pnpm --filter @rtb/project-controls-certification certify:phase11l
      - name: Assert PASS artifact
        run: |
          node <<'EOF'
          const a = JSON.parse(require("fs").readFileSync("packages/project-controls-certification/artifacts/phase11l-project-controls-explainability-certification.json","utf8"));
          const checks = [
            ["verdict", a.verdict==="PASS"],
            ["failedGateCount", a.failedGateCount===0],
            ["skippedGateCount", a.skippedGateCount===0],
            ["notExecutedGateCount", a.notExecutedGateCount===0],
            ["gateCount", Array.isArray(a.requiredGates) && a.requiredGates.length===55],
            ["version", a.version==="0.12.0-explainability-intelligence"],
            ["status", a.status==="explainability_intelligence"],
            ["progressIntelligenceReady", a.progressIntelligenceReady===true],
            ["scheduleIntelligenceReady", a.scheduleIntelligenceReady===true],
            ["changeIntelligenceReady", a.changeIntelligenceReady===true],
            ["costIntelligenceReady", a.costIntelligenceReady===true],
            ["productivityIntelligenceReady", a.productivityIntelligenceReady===true],
            ["forecastIntelligenceReady", a.forecastIntelligenceReady===true],
            ["projectContextCompositionReady", a.projectContextCompositionReady===true],
            ["decisionSupportReady", a.decisionSupportReady===true],
            ["DecisionSupportReady", a.DecisionSupportReady===true],
            ["scenarioIntelligenceReady", a.scenarioIntelligenceReady===true],
            ["ScenarioIntelligenceReady", a.ScenarioIntelligenceReady===true],
            ["riskOpportunityIntelligenceReady", a.riskOpportunityIntelligenceReady===true],
            ["RiskOpportunityIntelligenceReady", a.RiskOpportunityIntelligenceReady===true],
            ["assuranceIntelligenceReady", a.assuranceIntelligenceReady===true],
            ["AssuranceIntelligenceReady", a.AssuranceIntelligenceReady===true],
            ["explainabilityIntelligenceReady", a.explainabilityIntelligenceReady===true],
            ["ExplainabilityIntelligenceReady", a.ExplainabilityIntelligenceReady===true],
            ["explainabilityIntelligenceIsAdvisoryOnly", a.explainabilityIntelligenceIsAdvisoryOnly===true],
            ["projectSnapshotReady", a.projectSnapshotReady===true],
            ["projectTimelineReady", a.projectTimelineReady===true],
            ["progressIntelligence11bIntact", a.progressIntelligence11bIntact===true],
            ["changeIntelligence11dIntact", a.changeIntelligence11dIntact===true],
            ["costIntelligence11eIntact", a.costIntelligence11eIntact===true],
            ["productivityIntelligence11fIntact", a.productivityIntelligence11fIntact===true],
            ["productionProjectControlsReady", a.productionProjectControlsReady===false],
            ["automaticScenarioExecutionEnabled", a.automaticScenarioExecutionEnabled===false],
            ["automaticExplanationApprovalEnabled", a.automaticExplanationApprovalEnabled===false],
            ["automaticEvidenceCreationEnabled", a.automaticEvidenceCreationEnabled===false],
            ["automaticEvidenceApprovalEnabled", a.automaticEvidenceApprovalEnabled===false],
            ["automaticDecisionExecutionEnabled", a.automaticDecisionExecutionEnabled===false],
            ["automaticScheduleChangeEnabled", a.automaticScheduleChangeEnabled===false],
            ["automaticCostChangeEnabled", a.automaticCostChangeEnabled===false],
            ["automaticContractInstructionEnabled", a.automaticContractInstructionEnabled===false],
            ["resourcePlanningImplemented", a.resourcePlanningImplemented===false],
            ["earnedValueImplemented", a.earnedValueImplemented===false],
            ["predictiveSchedulingImplemented", a.predictiveSchedulingImplemented===false],
            ["productionMemoryRepositoryAllowed", a.productionMemoryRepositoryAllowed===false],
            ["duplicateProjectOwnershipDetected", a.duplicateProjectOwnershipDetected===false],
            ["duplicateExplainabilityOwnershipDetected", a.duplicateExplainabilityOwnershipDetected===false],
            ["projectDecisionOwnership", a.projectDecisionOwnership==="human_only"],
            ["phase11mReady", a.phase11mReady===true],
            ["releaseEligible", a.releaseEligible===true],
            ["requiredTestsSkipped", a.requiredTestsSkipped===false],
            ["artifactCommitSha", a.artifactCommitSha===a.ciHeadSha],
          ];
          const failed = checks.filter(([, ok]) => !ok).map(([n]) => n);
          if (failed.length) {
            console.error("Assert failed:", failed);
            console.error(JSON.stringify({ failedGates: a.failedGates, hostedDetail: a.hostedDetail }, null, 2));
            process.exit(1);
          }
          console.log(JSON.stringify({
            verdict: a.verdict,
            version: a.version,
            explainabilityIntelligenceReady: a.explainabilityIntelligenceReady,
            assuranceIntelligenceReady: a.assuranceIntelligenceReady,
            riskOpportunityIntelligenceReady: a.riskOpportunityIntelligenceReady,
            scenarioIntelligenceReady: a.scenarioIntelligenceReady,
            decisionSupportReady: a.decisionSupportReady,
            forecastIntelligenceReady: a.forecastIntelligenceReady,
            projectContextCompositionReady: a.projectContextCompositionReady,
            phase11mReady: a.phase11mReady,
          }, null, 2));
          EOF
      - name: Upload certification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase11l-project-controls-explainability-certification
          path: packages/project-controls-certification/artifacts/phase11l-project-controls-explainability-certification.json
          if-no-files-found: warn
