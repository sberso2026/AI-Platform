name: Phase 16C Tier-1 Pen-Test Readiness

on:
  workflow_dispatch:
  push:
    branches: [master, main, release/**, cursor/**]
    paths:
      - "packages/platform-identity/**"
      - "packages/platform-identity-certification/**"
      - "packages/platform-certification/src/phase16c*"
      - "docs/architecture/PLATFORM_IDENTITY_PHASE_16C.md"
      - "docs/security/RTB_TIER1_*"
      - ".github/workflows/phase-16c-tier1-pen-test-readiness.yml"

concurrency:
  group: phase-16c-tier1-pen-test-readiness-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORM_CERTIFICATION: "1"
  CERTIFY_BROWSER: "1"
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch release tags
        run: git fetch --tags --force
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @rtb/platform-identity-certification exec playwright install --with-deps chromium
      - name: Unit tests
        run: pnpm --filter @rtb/platform-identity test
      - name: Architecture tests
        run: pnpm --filter @rtb/platform-certification exec -- vitest run src/phase16c-tier1-pen-test-readiness.test.ts src/phase16b-platform-enterprise-sso.test.ts
      - name: Secret scan
        run: pnpm --filter @rtb/platform-identity-certification secret-scan
      - name: Phase 16C certification
        run: pnpm --filter @rtb/platform-identity-certification certify:phase16c
      - name: Assert PASS artifact
        run: |
          node <<'EOF'
          const a = JSON.parse(require("fs").readFileSync("packages/platform-identity-certification/artifacts/phase16c-tier1-pen-test-readiness-certification.json","utf8"));
          const checks = [
            ["verdict", a.verdict==="PASS"],
            ["failedGateCount", a.failedGateCount===0],
            ["skippedGateCount", a.skippedGateCount===0],
            ["notExecutedGateCount", a.notExecutedGateCount===0],
            ["requiredTestsSkipped", a.requiredTestsSkipped===0],
            ["gateCount", Array.isArray(a.requiredGates) && a.requiredGates.length===50],
            ["version", a.version==="0.3.0-pen-test-readiness" || a.version==="0.3.1-internal-adversarial"],
            ["ExternalPenTestReadinessReady", a.ExternalPenTestReadinessReady===true],
            ["ExternalPenTestScopeReady", a.ExternalPenTestScopeReady===true],
            ["PenTestRulesOfEngagementReady", a.PenTestRulesOfEngagementReady===true],
            ["PenTestEnvironmentReady", a.PenTestEnvironmentReady===true],
            ["PenTestTenantFixturesReady", a.PenTestTenantFixturesReady===true],
            ["PenTestEvidencePackageReady", a.PenTestEvidencePackageReady===true],
            ["PenTestRemediationWorkflowReady", a.PenTestRemediationWorkflowReady===true],
            ["PenTestRetestCriteriaReady", a.PenTestRetestCriteriaReady===true],
            ["S07ClosureCriteriaLocked", a.S07ClosureCriteriaLocked===true],
            ["nearFinalTier1AttackSurfaceReadyForExternalPenTest", a.nearFinalTier1AttackSurfaceReadyForExternalPenTest===true],
            ["S08CustomerSsoProductionReady", a.S08CustomerSsoProductionReady===true],
            ["S07ExternalPenTestComplete", a.S07ExternalPenTestComplete===false],
            ["ExternalPenTestComplete", a.ExternalPenTestComplete===false],
            ["Tier1EnterpriseProductionReady", a.Tier1EnterpriseProductionReady===false],
            ["FakeExternalPenTestResultPresent", a.FakeExternalPenTestResultPresent===false],
            ["InternalPenetrationTestOpinionIssued", a.InternalPenetrationTestOpinionIssued===false],
            ["SecurityAssuranceV1Intact", a.SecurityAssuranceV1Intact===true],
            ["EngineeringOSV1Intact", a.EngineeringOSV1Intact===true],
            ["unexpected5xx", a.unexpected5xx===0],
            ["releaseEligible", a.releaseEligible===true],
            ["secretExposure", a.secretExposure===false],
            ["secretExposureDetected", a.secretExposureDetected===false],
            ["artifactIdentity", a.artifactCommitSha===a.ciHeadSha && a.ciHeadSha===a.buildIdentitySha],
          ];
          const failed = checks.filter(([, ok]) => !ok).map(([n]) => n);
          if (failed.length) {
            console.error("Assert failed:", failed);
            console.error(JSON.stringify({ failedGates: a.failedGates }, null, 2));
            process.exit(1);
          }
          console.log("Phase 16C assert PASS");
          EOF
      - name: Upload certification artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase16c-tier1-pen-test-readiness-certification
          path: packages/platform-identity-certification/artifacts/phase16c-tier1-pen-test-readiness-certification.json
