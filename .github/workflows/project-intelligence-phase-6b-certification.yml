name: Project Intelligence Phase 6B Certification

on:
  workflow_dispatch:
  push:
    paths:
      - "packages/project-intelligence/**"
      - "packages/project-intelligence-certification/**"
      - "apps/web/src/app/(platform)/engineering/apps/project-intelligence/**"
      - "apps/web/src/app/api/engineering/project-intelligence/**"
      - "apps/web/src/components/engineering/project-intelligence-shell.tsx"
      - "supabase/migrations/20260712000000_batch_34_project_intelligence_mappings.sql"
      - "docs/**"
      - ".github/workflows/project-intelligence-phase-6b-certification.yml"

env:
  PROJECT_INTELLIGENCE_CERTIFICATION: "1"
  PROJECT_INTELLIGENCE_CERTIFICATION_TARGET: hosted_staging
  PROJECT_INTELLIGENCE_CERTIFICATION_PROJECT_REF: wcydlhqiqdwgoaqrlget
  ALLOW_PRODUCTION_CERTIFICATION: "false"
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: ${{ env.PNPM_VERSION }} }
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }}, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: CI secret preflight
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm --filter @rtb/project-intelligence-certification ci-preflight

  validate:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: ${{ env.PNPM_VERSION }} }
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }}, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rtb/project-intelligence typecheck
      - run: pnpm --filter @rtb/web typecheck
      - run: pnpm --filter @rtb/project-intelligence-certification test:unit
      - run: pnpm --filter @rtb/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  hosted-certification:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CERT_USER_PASSWORD: ${{ secrets.CERT_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: ${{ env.PNPM_VERSION }} }
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }}, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rtb/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - run: pnpm --filter @rtb/installation-certification provision
      - run: pnpm --filter @rtb/project-intelligence-certification exec playwright install chromium
      - run: pnpm project-intelligence:certify
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          COMMERCE_AUTH_SECRET: ${{ secrets.COMMERCE_AUTH_SECRET }}
          COMMERCE_SCHEDULER_SECRET: ${{ secrets.COMMERCE_SCHEDULER_SECRET }}
          CERT_USER_PASSWORD: ${{ secrets.CERT_USER_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROJECT_INTELLIGENCE_CERTIFICATION: "1"
          PROJECT_INTELLIGENCE_CERTIFICATION_TARGET: hosted_staging
          PROJECT_INTELLIGENCE_CERTIFICATION_PROJECT_REF: wcydlhqiqdwgoaqrlget
          ALLOW_PRODUCTION_CERTIFICATION: "false"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-intelligence-phase-6b-${{ github.run_id }}
          path: |
            packages/project-intelligence-certification/artifacts/
            packages/project-intelligence-certification/test-results/

  release-evidence:
    needs: hosted-certification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: project-intelligence-phase-6b-${{ github.run_id }}
          path: evidence
      - name: Verify artifact identity and eligibility
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          ARTIFACT="evidence/artifacts/project-intelligence-certification.json"
          test -f "$ARTIFACT"
          node <<'NODE'
          const fs = require("fs");
          const a = JSON.parse(fs.readFileSync("evidence/artifacts/project-intelligence-certification.json", "utf8"));
          const expected = process.env.EXPECTED_SHA;
          const failures = [];
          if (a.verdict !== "PASS") failures.push("verdict=" + a.verdict);
          if (!a.releaseEligible) failures.push("releaseEligible=false");
          if (a.commitSha !== expected) failures.push("commitSha mismatch");
          if (a.buildIdentityCommitSha !== expected) failures.push("buildIdentityCommitSha mismatch");
          if ((a.skippedGateCount ?? 0) > 0) failures.push("required skips=" + a.skippedGateCount);
          if ((a.unexpectedServerErrorCount ?? 0) > 0) failures.push("unexpected 5xx=" + a.unexpectedServerErrorCount);
          if (!a.productionCertificationBlocked) failures.push("production certification not blocked");
          const summary = {
            releaseEligible: a.releaseEligible,
            gates: `${a.passedGateCount}/${a.requiredGateCount}`,
            unexpected5xx: a.unexpectedServerErrorCount,
            commitSha: a.commitSha,
            expectedSha: expected,
          };
          console.log(JSON.stringify(summary, null, 2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "```json\n" + JSON.stringify(summary, null, 2) + "\n```\n");
          if (failures.length) {
            console.error(failures.join("; "));
            process.exit(1);
          }
          NODE
