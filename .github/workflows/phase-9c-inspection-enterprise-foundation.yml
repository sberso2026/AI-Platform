name: Phase 9C Inspection Intelligence Enterprise Foundation

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - release/**
      - cursor/**
    paths:
      - "packages/inspection-intelligence/**"
      - "packages/inspection-intelligence-certification/**"
      - "packages/engineering-os/src/module-sdk/**"
      - "packages/engineering-os/src/module-registry.ts"
      - "packages/engineering-os/src/index.ts"
      - "packages/platform-certification/src/phase9c*"
      - "apps/web/src/app/**/inspection-intelligence/**"
      - "supabase/migrations/*inspection_intelligence*"
      - "docs/architecture/INSPECTION_INTELLIGENCE_PHASE_9C*"
      - ".github/workflows/phase-9c-inspection-enterprise-foundation.yml"

concurrency:
  group: phase-9c-inspection-enterprise-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORM_CERTIFICATION: "1"
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch release tags
        run: git fetch --tags --force

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Engineering OS + Inspection unit tests
        run: |
          pnpm --filter @rtb/engineering-os test
          pnpm --filter @rtb/inspection-intelligence test

      - name: Architecture boundary tests
        run: pnpm --filter @rtb/platform-certification exec vitest run src/phase9c-inspection-enterprise.test.ts

      - name: Phase 9C certification (gates A–S)
        run: pnpm --filter @rtb/inspection-intelligence-certification certify:phase9c

      - name: Assert PASS artifact
        run: |
          node <<'EOF'
          const { readFileSync } = require("fs");
          const path = "packages/inspection-intelligence-certification/artifacts/phase9c-inspection-intelligence-enterprise-foundation-certification.json";
          const a = JSON.parse(readFileSync(path, "utf8"));
          const checks = [
            ["verdict", a.verdict === "PASS"],
            ["failedGateCount", a.failedGateCount === 0],
            ["skippedGateCount", a.skippedGateCount === 0],
            ["notExecutedGateCount", a.notExecutedGateCount === 0],
            ["unexpected5xx", a.unexpected5xx === 0],
            ["secretExposureDetected", a.secretExposureDetected === false],
            ["releaseTagMoved", a.releaseTagMoved === false],
            ["projectIntelligenceV1Intact", a.projectIntelligenceV1Intact === true],
            ["architecturalReservationsIntact", a.architecturalReservationsIntact === true],
            ["releaseEligible", a.releaseEligible === true],
            ["enterpriseFoundationReady", a.enterpriseFoundationReady === true],
            ["phase9DReady", a.phase9DReady === true],
            ["gatesExecuted", Array.isArray(a.requiredGates) && a.requiredGates.length === 19],
          ];
          const failed = checks.filter(([, ok]) => !ok).map(([n]) => n);
          if (failed.length) {
            console.error("Assert failed:", failed);
            process.exit(1);
          }
          console.log(JSON.stringify({
            verdict: a.verdict,
            enterpriseFoundationReady: a.enterpriseFoundationReady,
            phase9DReady: a.phase9DReady,
          }, null, 2));
          EOF

      - name: Upload certification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase9c-inspection-intelligence-enterprise-foundation-certification
          path: packages/inspection-intelligence-certification/artifacts/phase9c-inspection-intelligence-enterprise-foundation-certification.json
          if-no-files-found: error
