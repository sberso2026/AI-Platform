name: Phase 10B.1 Asset Intelligence Hosted Persistence

on:
  workflow_dispatch:
  push:
    branches: [master, main, release/**, cursor/**]
    paths:
      - "packages/asset-intelligence/**"
      - "packages/asset-intelligence-certification/**"
      - "packages/platform-certification/src/phase10b1*"
      - "supabase/migrations/*asset_intelligence*"
      - "apps/web/src/app/api/engineering/asset-intelligence/**"
      - ".github/workflows/phase-10b1-asset-intelligence-hosted-persistence.yml"

concurrency:
  group: phase-10b1-asset-intelligence-hosted-persistence-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"
  ASSET_INTELLIGENCE_CERTIFICATION: "1"
  ASSET_INTELLIGENCE_CERTIFICATION_PROJECT_REF: wcydlhqiqdwgoaqrlget

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --tags --force
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply hosted migration (when DB URL available)
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -n "${SUPABASE_DB_URL}" ]; then
            pnpm --filter @rtb/asset-intelligence-certification apply:hosted-migration
          else
            echo "SUPABASE_DB_URL not set — will verify existing hosted schema only"
          fi
      - name: Unit tests
        run: pnpm --filter @rtb/asset-intelligence test
      - name: Architecture tests
        run: pnpm --filter @rtb/platform-certification exec vitest run src/phase10b1-asset-intelligence-hosted-persistence.test.ts
      - name: Phase 10B.1 certification (gates A–AE)
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AI_CERT_TENANT_ID: ${{ secrets.AI_CERT_TENANT_ID }}
          AI_CERT_WORKSPACE_ID: ${{ secrets.AI_CERT_WORKSPACE_ID }}
          AI_CERT_ASSET_ID: ${{ secrets.AI_CERT_ASSET_ID }}
        run: pnpm --filter @rtb/asset-intelligence-certification certify:phase10b1
      - name: Assert PASS artifact
        run: |
          node <<'EOF'
          const a = JSON.parse(require("fs").readFileSync("packages/asset-intelligence-certification/artifacts/phase10b1-asset-intelligence-hosted-persistence-certification.json","utf8"));
          const checks = [
            a.verdict==="PASS",
            a.failedGateCount===0,
            a.skippedGateCount===0,
            a.notExecutedGateCount===0,
            a.hostedAssetIntelligencePersistenceReady===true,
            a.productionMemoryRepositoryAllowed===false,
            a.productionAssetIntelligenceReady===false,
            a.accuracyClaimsCertified===false,
            a.rulClaimsCertified===false,
            a.releaseEligible===true,
            a.phase10CReady===true,
            a.requiredGates.length===31,
          ];
          if (checks.some(x=>!x)) { console.error(a); process.exit(1); }
          console.log(JSON.stringify({verdict:a.verdict, hosted:a.hostedAssetIntelligencePersistenceReady},null,2));
          EOF
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase10b1-asset-intelligence-hosted-persistence-certification
          path: packages/asset-intelligence-certification/artifacts/phase10b1-asset-intelligence-hosted-persistence-certification.json
          if-no-files-found: warn
