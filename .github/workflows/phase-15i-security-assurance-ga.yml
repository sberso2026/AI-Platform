name: Phase 15I Security & Assurance V1.0 GA

on:
  workflow_dispatch:
  push:
    branches: [master, main, release/**, cursor/**]
    paths:
      - "packages/security-assurance/**"
      - "packages/security-assurance-certification/**"
      - "packages/platform-certification/src/phase15*"
      - "apps/web/src/app/(platform)/platform/security-assurance/**"
      - "docs/security/SECURITY_ASSURANCE_*"
      - "docs/commercial/SECURITY_ASSURANCE_*"
      - "docs/operations/SECURITY_ASSURANCE_*"
      - "docs/architecture/SECURITY_ASSURANCE_PHASE_15I.md"
      - ".github/workflows/phase-15i-security-assurance-ga.yml"

concurrency:
  group: phase-15i-security-assurance-ga-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORM_CERTIFICATION: "1"
  CERTIFY_BROWSER: "1"
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch release tags
        run: git fetch --tags --force
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @rtb/security-assurance-certification exec playwright install --with-deps chromium
      - name: Unit tests
        run: pnpm --filter @rtb/security-assurance test
      - name: Architecture regression 15A–15I
        run: pnpm --filter @rtb/platform-certification exec -- vitest run src/phase15a-security-assurance-discovery.test.ts src/phase15b-security-assurance-foundation.test.ts src/phase15c-security-assurance-isolation.test.ts src/phase15d-security-assurance-ai-data.test.ts src/phase15e-security-assurance-secure-compute.test.ts src/phase15f-security-assurance-compliance.test.ts src/phase15g-security-assurance-customer.test.ts src/phase15h-security-assurance-v1-ga.test.ts src/phase15i-security-assurance-ga.test.ts
      - name: Secret scan
        run: pnpm --filter @rtb/security-assurance-certification secret-scan
      - name: Phase 15I certification (gates A–BT)
        run: pnpm --filter @rtb/security-assurance-certification certify:phase15i
      - name: Assert PASS artifact
        run: |
          node <<'EOF'
          const a = JSON.parse(require("fs").readFileSync("packages/security-assurance-certification/artifacts/phase15i-security-assurance-ga-certification.json","utf8"));
          const checks = [
            ["verdict", a.verdict==="PASS"],
            ["failedGateCount", a.failedGateCount===0],
            ["skippedGateCount", a.skippedGateCount===0],
            ["notExecutedGateCount", a.notExecutedGateCount===0],
            ["requiredTestsSkipped", a.requiredTestsSkipped===0],
            ["gateCount", Array.isArray(a.requiredGates) && a.requiredGates.length===72],
            ["version", a.version==="1.0.0"],
            ["status", a.status==="ga"],
            ["SecurityAssuranceV1GaCertified", a.SecurityAssuranceV1GaCertified===true],
            ["SecurityAssuranceV1Frozen", a.SecurityAssuranceV1Frozen===true],
            ["SecurityAssurancePublicContractsFrozen", a.SecurityAssurancePublicContractsFrozen===true],
            ["SecurityAssuranceManifestFrozen", a.SecurityAssuranceManifestFrozen===true],
            ["productionSecurityAssuranceReady", a.productionSecurityAssuranceReady===true],
            ["CustomerTrustCenterImplemented", a.CustomerTrustCenterImplemented===false],
            ["S07ExternalPenTestComplete", a.S07ExternalPenTestComplete===false],
            ["S08CustomerSsoProductionReady", a.S08CustomerSsoProductionReady===false],
            ["EngineeringOSV1Intact", a.EngineeringOSV1Intact===true],
            ["releaseEligible", a.releaseEligible===true],
            ["secretExposureDetected", a.secretExposureDetected===false],
            ["artifactIdentity", a.artifactCommitSha===a.ciHeadSha && a.ciHeadSha===a.buildIdentitySha],
            ["releaseTag", a.releaseTag==="security-assurance-v1.0.0"],
          ];
          const failed = checks.filter(([, ok]) => !ok).map(([n]) => n);
          if (failed.length) {
            console.error("Assert failed:", failed);
            process.exit(1);
          }
          if (a.tagToCreate) {
            console.log("Release owner must create immutable tag", a.tagToCreate, "at", a.ciHeadSha, "(workflow never creates it).");
          } else {
            console.log("Release tag already points at build:", a.releaseTagTarget);
          }
          console.log("Phase 15I assert PASS");
          EOF
      - name: Upload certification artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase15i-security-assurance-ga-certification
          path: packages/security-assurance-certification/artifacts/phase15i-security-assurance-ga-certification.json
