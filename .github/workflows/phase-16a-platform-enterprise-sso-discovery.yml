name: Phase 16A Platform Enterprise SSO Discovery

on:
  workflow_dispatch:
  push:
    branches: [master, main, release/**, cursor/**]
    paths:
      - "packages/platform-identity/**"
      - "packages/platform-identity-certification/**"
      - "packages/platform-certification/src/phase16a*"
      - "docs/identity/PLATFORM_*"
      - "docs/architecture/PLATFORM_ENTERPRISE_*"
      - "docs/architecture/PLATFORM_IDENTITY_PHASE_16A.md"
      - "docs/security/PLATFORM_ENTERPRISE_SSO_THREAT_MODEL.md"
      - ".github/workflows/phase-16a-platform-enterprise-sso-discovery.yml"

concurrency:
  group: phase-16a-platform-enterprise-sso-discovery-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORM_CERTIFICATION: "1"
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch release tags
        run: git fetch --tags --force
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests (Platform Identity discovery)
        run: pnpm --filter @rtb/platform-identity test
      - name: Architecture tests
        run: pnpm --filter @rtb/platform-certification exec -- vitest run src/phase16a-platform-enterprise-sso-discovery.test.ts
      - name: Secret scan
        run: pnpm --filter @rtb/platform-identity-certification secret-scan
      - name: Phase 16A certification
        run: pnpm --filter @rtb/platform-identity-certification certify:phase16a
      - name: Assert PASS artifact
        run: |
          node <<'EOF'
          const a = JSON.parse(require("fs").readFileSync("packages/platform-identity-certification/artifacts/phase16a-platform-enterprise-sso-discovery-certification.json","utf8"));
          const checks = [
            ["verdict", a.verdict==="PASS"],
            ["failedGateCount", a.failedGateCount===0],
            ["skippedGateCount", a.skippedGateCount===0],
            ["notExecutedGateCount", a.notExecutedGateCount===0],
            ["gateCount", Array.isArray(a.requiredGates) && a.requiredGates.length===57],
            ["version", a.version==="0.1.0-enterprise-sso-discovery"],
            ["status", a.status==="discovery"],
            ["EnterpriseIdentityDiscoveryReady", a.EnterpriseIdentityDiscoveryReady===true],
            ["S08CustomerSsoProductionReady", a.S08CustomerSsoProductionReady===false],
            ["S07ExternalPenTestComplete", a.S07ExternalPenTestComplete===false],
            ["Tier1EnterpriseProductionReady", a.Tier1EnterpriseProductionReady===false],
            ["securityAssuranceOwnsCustomerSso", a.securityAssuranceOwnsCustomerSso===false],
            ["EnterpriseSsoRuntimeImplemented", a.EnterpriseSsoRuntimeImplemented===false],
            ["duplicateIdentityProviderDetected", a.duplicateIdentityProviderDetected===false],
            ["SecurityAssuranceV1Intact", a.SecurityAssuranceV1Intact===true],
            ["EngineeringOSV1Intact", a.EngineeringOSV1Intact===true],
            ["phase16BReady", a.phase16BReady===true],
            ["releaseEligible", a.releaseEligible===true],
            ["secretExposureDetected", a.secretExposureDetected===false],
            ["artifactIdentity", a.artifactCommitSha===a.ciHeadSha && a.ciHeadSha===a.buildIdentitySha],
          ];
          const failed = checks.filter(([, ok]) => !ok).map(([n]) => n);
          if (failed.length) {
            console.error("Assert failed:", failed);
            console.error(JSON.stringify({ failedGates: a.failedGates }, null, 2));
            process.exit(1);
          }
          console.log("Phase 16A assert PASS");
          EOF
      - name: Upload certification artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase16a-platform-enterprise-sso-discovery-certification
          path: packages/platform-identity-certification/artifacts/phase16a-platform-enterprise-sso-discovery-certification.json
