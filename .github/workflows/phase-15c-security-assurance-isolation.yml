name: Phase 15C Security & Assurance Isolation

on:
  workflow_dispatch:
  push:
    branches: [master, main, release/**, cursor/**]
    paths:
      - "packages/security-assurance/**"
      - "packages/security-assurance-certification/**"
      - "packages/platform-certification/src/phase15c*"
      - "apps/web/src/app/(platform)/platform/security-assurance/**"
      - "supabase/migrations/20260808300000_batch_91_security_assurance_isolation.sql"
      - "docs/security/SECURITY_ASSURANCE_*"
      - "docs/architecture/SECURITY_ASSURANCE_PHASE_15C.md"
      - ".github/workflows/phase-15c-security-assurance-isolation.yml"

concurrency:
  group: phase-15c-security-assurance-isolation-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORM_CERTIFICATION: "1"
  CERTIFY_BROWSER: "1"
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch release tags
        run: git fetch --tags --force
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @rtb/security-assurance-certification exec playwright install --with-deps chromium
      - name: Unit tests (Security & Assurance isolation)
        run: pnpm --filter @rtb/security-assurance test
      - name: Architecture tests
        run: pnpm --filter @rtb/platform-certification exec -- vitest run src/phase15a-security-assurance-discovery.test.ts src/phase15b-security-assurance-foundation.test.ts src/phase15c-security-assurance-isolation.test.ts
      - name: Secret scan
        run: pnpm --filter @rtb/security-assurance-certification secret-scan
      - name: Phase 15C certification (gates A–BR)
        run: pnpm --filter @rtb/security-assurance-certification certify:phase15c
      - name: Assert PASS artifact
        run: |
          node <<'EOF'
          const a = JSON.parse(require("fs").readFileSync("packages/security-assurance-certification/artifacts/phase15c-security-assurance-isolation-certification.json","utf8"));
          const checks = [
            ["verdict", a.verdict==="PASS"],
            ["failedGateCount", a.failedGateCount===0],
            ["skippedGateCount", a.skippedGateCount===0],
            ["notExecutedGateCount", a.notExecutedGateCount===0],
            ["gateCount", Array.isArray(a.requiredGates) && a.requiredGates.length===70],
            ["version", a.version==="0.3.0-isolation-assurance"],
            ["status", a.status==="isolation_assurance"],
            ["IsolationAssuranceReady", a.IsolationAssuranceReady===true],
            ["IsolationAssuranceRuntimeImplemented", a.IsolationAssuranceRuntimeImplemented===true],
            ["knownCrossTenantLeakageDetected", a.knownCrossTenantLeakageDetected===false],
            ["knownCrossWorkspaceLeakageDetected", a.knownCrossWorkspaceLeakageDetected===false],
            ["automaticRemediationEnabled", a.automaticRemediationEnabled===false],
            ["automaticRlsMutationEnabled", a.automaticRlsMutationEnabled===false],
            ["SecurityIntelligenceImplemented", a.SecurityIntelligenceImplemented===false],
            ["duplicatePolicyEngineDetected", a.duplicatePolicyEngineDetected===false],
            ["EngineeringOSV1Intact", a.EngineeringOSV1Intact===true],
            ["phase15DReady", a.phase15DReady===true],
            ["releaseEligible", a.releaseEligible===true],
            ["secretExposureDetected", a.secretExposureDetected===false],
            ["artifactIdentity", a.artifactCommitSha===a.ciHeadSha && a.ciHeadSha===a.buildIdentitySha],
          ];
          const failed = checks.filter(([, ok]) => !ok).map(([n]) => n);
          if (failed.length) {
            console.error("Assert failed:", failed);
            console.error(JSON.stringify({ failedGates: a.failedGates }, null, 2));
            process.exit(1);
          }
          console.log(JSON.stringify({
            verdict: a.verdict,
            version: a.version,
            phase15DReady: a.phase15DReady,
            IsolationAssuranceReady: a.IsolationAssuranceReady,
          }, null, 2));
          EOF
      - name: Upload certification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase15c-security-assurance-isolation-certification
          path: packages/security-assurance-certification/artifacts/phase15c-security-assurance-isolation-certification.json
          if-no-files-found: warn
